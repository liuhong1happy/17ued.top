<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="TypeScript 类型收窄：unknown 或联合类型通过 typeof、instanceof、in、可辨识联合和自定义类型守卫收窄为具体类型，最后用 never 做穷尽检查">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .head { fill: #e2e8f0; font-size: 20px; font-weight: 600; text-anchor: middle; }
      .sub { fill: #94a3b8; font-size: 12.5px; text-anchor: middle; }
      .wide { fill: rgba(251,191,36,0.15); stroke: rgba(251,191,36,0.52); stroke-width: 1.3; }
      .n1 { fill: rgba(56,189,248,0.13); stroke: rgba(56,189,248,0.48); stroke-width: 1.2; }
      .n2 { fill: rgba(99,102,241,0.15); stroke: rgba(129,140,248,0.52); stroke-width: 1.2; }
      .n3 { fill: rgba(52,211,153,0.13); stroke: rgba(52,211,153,0.48); stroke-width: 1.2; }
      .n4 { fill: rgba(167,139,250,0.14); stroke: rgba(167,139,250,0.5); stroke-width: 1.2; }
      .n5 { fill: rgba(248,113,113,0.12); stroke: rgba(248,113,113,0.45); stroke-width: 1.2; }
      .result { fill: rgba(52,211,153,0.16); stroke: rgba(52,211,153,0.55); stroke-width: 1.3; }
      .t { fill: #e2e8f0; font-size: 13.5px; font-weight: 600; text-anchor: middle; }
      .s { fill: #94a3b8; font-size: 11px; text-anchor: middle; }
      .code { fill: #c7d2fe; font-size: 11px; text-anchor: middle; font-family: ui-monospace, Consolas, monospace; }
      .note { fill: #94a3b8; font-size: 11.5px; }
      .g { fill: #6ee7b7; font-size: 11.5px; }
      .flow { stroke: #818cf8; stroke-width: 1.6; fill: none; }
      .box { fill: rgba(255,255,255,0.04); stroke: rgba(255,255,255,0.13); stroke-width: 1; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#818cf8" />
    </marker>
  </defs>

  <text x="600" y="32" class="head">类型收窄：把宽类型变窄的五种手段</text>
  <text x="600" y="56" class="sub">收窄只在编译期生效；自定义守卫内部必须真的做运行时检查</text>

  <rect class="wide" x="440" y="80" width="320" height="62" rx="10" />
  <text class="t" x="600" y="106">unknown / A | B | C</text>
  <text class="s" x="600" y="126">外部输入、联合类型、可选值</text>

  <!-- arrows -->
  <line class="flow" x1="520" y1="142" x2="150" y2="190" marker-end="url(#a)" />
  <line class="flow" x1="560" y1="142" x2="370" y2="190" marker-end="url(#a)" />
  <line class="flow" x1="600" y1="142" x2="600" y2="190" marker-end="url(#a)" />
  <line class="flow" x1="640" y1="142" x2="830" y2="190" marker-end="url(#a)" />
  <line class="flow" x1="680" y1="142" x2="1050" y2="190" marker-end="url(#a)" />

  <!-- five techniques -->
  <rect class="n1" x="35" y="194" width="220" height="170" rx="10" />
  <text class="t" x="145" y="220">typeof</text>
  <text class="s" x="145" y="242">基本类型判断</text>
  <text class="code" x="145" y="274">typeof v === "string"</text>
  <text class="s" x="145" y="300">→ string</text>
  <text class="note" x="55" y="330">适用：string / number /</text>
  <text class="note" x="55" y="348">boolean / function / symbol</text>

  <rect class="n2" x="275" y="194" width="220" height="170" rx="10" />
  <text class="t" x="385" y="220">instanceof</text>
  <text class="s" x="385" y="242">类实例判断</text>
  <text class="code" x="385" y="274">v instanceof Error</text>
  <text class="s" x="385" y="300">→ Error</text>
  <text class="note" x="295" y="330">适用：类、内置对象</text>
  <text class="note" x="295" y="348">（跨 iframe 可能失效）</text>

  <rect class="n3" x="515" y="194" width="220" height="170" rx="10" />
  <text class="t" x="625" y="220">in</text>
  <text class="s" x="625" y="242">属性存在性判断</text>
  <text class="code" x="625" y="274">"id" in v</text>
  <text class="s" x="625" y="300">→ A</text>
  <text class="note" x="535" y="330">适用：结构不同的对象联合</text>
  <text class="note" x="535" y="348">注意：只判断 key 是否存在</text>

  <rect class="n4" x="755" y="194" width="220" height="170" rx="10" />
  <text class="t" x="865" y="220">可辨识联合</text>
  <text class="s" x="865" y="242">字面量字段判断</text>
  <text class="code" x="865" y="274">switch (v.type)</text>
  <text class="s" x="865" y="300">→ 具体成员</text>
  <text class="note" x="775" y="330">适用：状态机、API 响应</text>
  <text class="note" x="775" y="348">最推荐，穷尽检查友好</text>

  <rect class="n5" x="995" y="194" width="170" height="170" rx="10" />
  <text class="t" x="1080" y="220">自定义守卫</text>
  <text class="s" x="1080" y="242">value is T</text>
  <text class="code" x="1080" y="274">isUser(v)</text>
  <text class="s" x="1080" y="300">→ User</text>
  <text class="note" x="1008" y="330">内部要写运行时判断</text>
  <text class="note" x="1008" y="348">适合复杂业务校验</text>

  <!-- arrows down to result -->
  <line class="flow" x1="145" y1="364" x2="145" y2="424" marker-end="url(#a)" />
  <line class="flow" x1="385" y1="364" x2="385" y2="424" marker-end="url(#a)" />
  <line class="flow" x1="625" y1="364" x2="625" y2="424" marker-end="url(#a)" />
  <line class="flow" x1="865" y1="364" x2="865" y2="424" marker-end="url(#a)" />
  <line class="flow" x1="1080" y1="364" x2="1080" y2="424" marker-end="url(#a)" />

  <rect class="result" x="45" y="428" width="1110" height="64" rx="10" />
  <text class="t" x="600" y="454">收窄为具体类型，可以安全访问该类型的属性/方法</text>
  <text class="s" x="600" y="476">控制流分析会自动收窄；分支结束后类型可能重新合并</text>

  <!-- exhaustive -->
  <rect class="n5" x="360" y="516" width="480" height="64" rx="10" />
  <text class="t" x="600" y="542">default: assertNever(value)</text>
  <text class="s" x="600" y="564">联合类型新增成员时，这里编译报错 → 强制处理新情况</text>

  <text class="note" x="40" y="546">穷尽检查：</text>
  <text class="note" x="40" y="568">never 是底部类型，</text>
  <text class="note" x="40" y="590">只接受不可能的值。</text>
</svg>
