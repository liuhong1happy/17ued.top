<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Flutter 异步方案选择：一次性结果用 Future，连续事件用 Stream，CPU 密集任务用 Isolate，调用原生能力用 MethodChannel">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .head { fill: #e2e8f0; font-size: 20px; font-weight: 600; text-anchor: middle; }
      .sub { fill: #94a3b8; font-size: 12.5px; text-anchor: middle; }
      .root { fill: rgba(251,191,36,0.16); stroke: rgba(251,191,36,0.55); stroke-width: 1.3; }
      .b1 { fill: rgba(56,189,248,0.13); stroke: rgba(56,189,248,0.48); stroke-width: 1.2; }
      .b2 { fill: rgba(52,211,153,0.13); stroke: rgba(52,211,153,0.48); stroke-width: 1.2; }
      .b3 { fill: rgba(167,139,250,0.14); stroke: rgba(167,139,250,0.5); stroke-width: 1.2; }
      .b4 { fill: rgba(99,102,241,0.16); stroke: rgba(129,140,248,0.52); stroke-width: 1.2; }
      .t { fill: #e2e8f0; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .s { fill: #94a3b8; font-size: 11.5px; text-anchor: middle; }
      .b { fill: #7dd3fc; font-size: 11.5px; }
      .g { fill: #6ee7b7; font-size: 11.5px; }
      .p { fill: #c4b5fd; font-size: 11.5px; }
      .i { fill: #a5b4fc; font-size: 11.5px; }
      .note { fill: #94a3b8; font-size: 11.5px; }
      .warn { fill: #fca5a5; font-size: 11.5px; }
      .flow { stroke: #818cf8; stroke-width: 1.8; fill: none; }
      .box { fill: rgba(255,255,255,0.04); stroke: rgba(255,255,255,0.13); stroke-width: 1; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#818cf8" />
    </marker>
  </defs>

  <text x="600" y="32" class="head">Flutter 异步方案怎么选</text>
  <text x="600" y="56" class="sub">先判断结果形态和任务类型，再选 API；不要把所有异步都写成 Future</text>

  <rect class="root" x="480" y="84" width="240" height="56" rx="10" />
  <text class="t" x="600" y="108">一个异步需求</text>
  <text class="s" x="600" y="127">结果几次？会阻塞 UI 吗？</text>

  <line class="flow" x1="520" y1="140" x2="170" y2="190" marker-end="url(#a)" />
  <line class="flow" x1="560" y1="140" x2="450" y2="190" marker-end="url(#a)" />
  <line class="flow" x1="640" y1="140" x2="750" y2="190" marker-end="url(#a)" />
  <line class="flow" x1="680" y1="140" x2="1030" y2="190" marker-end="url(#a)" />

  <!-- branch 1 -->
  <rect class="b1" x="40" y="194" width="260" height="290" rx="11" />
  <text class="t" x="170" y="222">一次性结果</text>
  <text class="b" x="170" y="246">Future + async/await</text>
  <text class="s" x="170" y="274">网络请求 · 文件读取</text>
  <text class="s" x="170" y="294">数据库查询 · 单次初始化</text>
  <text class="note" x="60" y="330">要点：</text>
  <text class="note" x="60" y="352">· 每个 await 都可能让出执行权</text>
  <text class="note" x="60" y="374">· 错误用 try/catch 包住 await</text>
  <text class="note" x="60" y="396">· Future 本身不可取消</text>
  <text class="note" x="60" y="418">· 无依赖批量用 Future.wait</text>
  <text class="note" x="60" y="440">· 顺序依赖用 await 串行</text>
  <text class="warn" x="60" y="466">别在 build 里创建 Future</text>

  <!-- branch 2 -->
  <rect class="b2" x="320" y="194" width="260" height="290" rx="11" />
  <text class="t" x="450" y="222">连续事件</text>
  <text class="g" x="450" y="246">Stream</text>
  <text class="s" x="450" y="274">WebSocket · 传感器</text>
  <text class="s" x="450" y="294">用户输入 · 日志 · 进度</text>
  <text class="note" x="340" y="330">要点：</text>
  <text class="note" x="340" y="352">· 单订阅 vs 广播要选对</text>
  <text class="note" x="340" y="374">· StreamBuilder 只创建一次流</text>
  <text class="note" x="340" y="396">· subscription.cancel() 释放</text>
  <text class="note" x="340" y="418">· 支持 pause/resume 背压</text>
  <text class="note" x="340" y="440">· async* / yield 生成事件</text>
  <text class="warn" x="340" y="466">单订阅流重复 listen 会报错</text>

  <!-- branch 3 -->
  <rect class="b3" x="600" y="194" width="260" height="290" rx="11" />
  <text class="t" x="730" y="222">CPU 密集 / 可能卡帧</text>
  <text class="p" x="730" y="246">Isolate.run / compute</text>
  <text class="s" x="730" y="274">大 JSON 解析 · 图片处理</text>
  <text class="s" x="730" y="294">加密 · 压缩 · 复杂计算</text>
  <text class="note" x="620" y="330">要点：</text>
  <text class="note" x="620" y="352">· 独立内存，不能共享对象</text>
  <text class="note" x="620" y="374">· 消息默认拷贝，注意成本</text>
  <text class="note" x="620" y="396">· compute 回调需顶层/静态函数</text>
  <text class="note" x="620" y="418">· Web 平台没有 Isolate</text>
  <text class="note" x="620" y="440">· 长期任务用 Isolate.spawn</text>
  <text class="warn" x="620" y="466">async 包不住同步计算</text>

  <!-- branch 4 -->
  <rect class="b4" x="880" y="194" width="280" height="290" rx="11" />
  <text class="t" x="1020" y="222">调用原生能力</text>
  <text class="i" x="1020" y="246">MethodChannel / Pigeon</text>
  <text class="s" x="1020" y="274">相机 · 支付 · 蓝牙 · 文件</text>
  <text class="s" x="1020" y="294">原生 SDK · 平台 View</text>
  <text class="note" x="900" y="330">要点：</text>
  <text class="note" x="900" y="352">· Dart 侧返回 Future</text>
  <text class="note" x="900" y="374">· 原生侧可能在主线程执行</text>
  <text class="note" x="900" y="396">· 方法名/参数用 Pigeon 保类型</text>
  <text class="note" x="900" y="418">· 错误用 PlatformException 处理</text>
  <text class="note" x="900" y="440">· 长任务在原生侧开线程</text>
  <text class="warn" x="900" y="466">不要在主线程做重活</text>

  <!-- bottom note -->
  <rect class="box" x="40" y="516" width="1120" height="76" rx="10" />
  <text class="note" x="62" y="542">判断顺序：结果是一次还是多次？→ 会不会阻塞 UI 超过一帧？→ 是否需要原生能力？</text>
  <text class="note" x="62" y="566">UI Isolate 只做轻量调度；CPU 密集任务无论是否包在 async 里，都必须移到 Isolate，否则照样掉帧。</text>
  <text class="note" x="62" y="586">I/O 和网络不需要自己开 Isolate，Dart 运行时已经用异步 I/O 处理。</text>
</svg>
