<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="一次任务的 trace：第 1 轮到回答由同一条 trace_id 串起，中间的人工确认可能挂起数小时；每个 span 至少记录输入输出摘要、耗时、token 与成本、重试次数、失败类型与是否转人工">
  <defs>
    <marker id="o-slate" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#0f172a"/>
  <text x="24" y="32" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#94a3b8">一次任务的 trace 与每个 span 要记的东西</text>

  <!-- span 链 -->
  <rect x="20" y="60" width="124" height="52" rx="10" fill="#151d33" stroke="#2b3a55"/>
  <text x="82" y="83" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#dbe3f0">第 1 轮</text>
  <text x="82" y="101" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8b9bb4">2.4s</text>
  <line x1="144" y1="86" x2="165" y2="86" stroke="#64748b" stroke-width="1.5" marker-end="url(#o-slate)"/>

  <rect x="169" y="60" width="124" height="52" rx="10" fill="#151d33" stroke="#2b3a55"/>
  <text x="231" y="83" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#dbe3f0">第 2 轮</text>
  <text x="231" y="101" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8b9bb4">3.1s</text>
  <line x1="293" y1="86" x2="314" y2="86" stroke="#64748b" stroke-width="1.5" marker-end="url(#o-slate)"/>

  <rect x="318" y="60" width="124" height="52" rx="10" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.55" stroke-dasharray="5 3"/>
  <text x="380" y="83" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#fbbf24">人工确认</text>
  <text x="380" y="101" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#c9a35f">挂起 3h</text>
  <line x1="442" y1="86" x2="463" y2="86" stroke="#64748b" stroke-width="1.5" marker-end="url(#o-slate)"/>

  <rect x="467" y="60" width="124" height="52" rx="10" fill="#151d33" stroke="#2b3a55"/>
  <text x="529" y="83" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#dbe3f0">第 3 轮</text>
  <text x="529" y="101" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8b9bb4">1.8s</text>
  <line x1="591" y1="86" x2="612" y2="86" stroke="#64748b" stroke-width="1.5" marker-end="url(#o-slate)"/>

  <rect x="616" y="60" width="124" height="52" rx="10" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.45"/>
  <text x="678" y="83" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">回答</text>
  <text x="678" y="101" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8b9bb4">终态</text>

  <!-- trace_id 括线 -->
  <line x1="20" y1="132" x2="740" y2="132" stroke="#2b3a55"/>
  <line x1="20" y1="132" x2="20" y2="140" stroke="#2b3a55"/>
  <line x1="740" y1="132" x2="740" y2="140" stroke="#2b3a55"/>
  <text x="380" y="160" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#8b9bb4">同一条 trace_id 串起来——第 2 轮与第 3 轮之间可能隔着 3 小时，也可能换了进程</text>

  <!-- 记录清单 -->
  <text x="24" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">每个 span 至少记这些</text>
  <rect x="20" y="210" width="720" height="130" rx="10" fill="#94a3b8" fill-opacity="0.06" stroke="#2b3a55"/>

  <rect x="40" y="230" width="158" height="38" rx="8" fill="#151d33" stroke="#2b3a55"/>
  <text x="119" y="254" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#a9b7cc">输入摘要</text>
  <rect x="214" y="230" width="158" height="38" rx="8" fill="#151d33" stroke="#2b3a55"/>
  <text x="293" y="254" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#a9b7cc">输出摘要</text>
  <rect x="388" y="230" width="158" height="38" rx="8" fill="#151d33" stroke="#2b3a55"/>
  <text x="467" y="254" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#a9b7cc">耗时</text>
  <rect x="562" y="230" width="158" height="38" rx="8" fill="#151d33" stroke="#2b3a55"/>
  <text x="641" y="254" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#a9b7cc">token 与成本</text>

  <rect x="40" y="280" width="158" height="38" rx="8" fill="#151d33" stroke="#2b3a55"/>
  <text x="119" y="304" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#a9b7cc">重试次数</text>
  <rect x="214" y="280" width="158" height="38" rx="8" fill="#151d33" stroke="#2b3a55"/>
  <text x="293" y="304" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#a9b7cc">失败类型</text>
  <rect x="388" y="280" width="158" height="38" rx="8" fill="#151d33" stroke="#2b3a55"/>
  <text x="467" y="304" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#a9b7cc">是否转人工</text>

  <text x="24" y="372" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#7c8aa5">记摘要，不记原文——trace 里塞满用户原文和完整工具返回，本身就是一个泄露面</text>
</svg>
