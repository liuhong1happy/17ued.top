<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="语音合成技术代际演进：拼接与参数合成、神经声学模型、大模型零样本克隆三个阶段，以及各阶段的代表项目">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .g1 { fill: rgba(148,163,184,0.13); stroke: rgba(148,163,184,0.42); stroke-width: 1.2; }
      .g2 { fill: rgba(56,189,248,0.13); stroke: rgba(56,189,248,0.45); stroke-width: 1.2; }
      .g3 { fill: rgba(99,102,241,0.18); stroke: rgba(129,140,248,0.6); stroke-width: 1.3; }
      .proj1 { fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.14); stroke-width: 1; }
      .proj2 { fill: rgba(56,189,248,0.10); stroke: rgba(56,189,248,0.35); stroke-width: 1; }
      .proj3 { fill: rgba(167,139,250,0.14); stroke: rgba(167,139,250,0.45); stroke-width: 1; }
      .head { fill: #e2e8f0; font-size: 19px; font-weight: 600; text-anchor: middle; }
      .era { fill: #e2e8f0; font-size: 16px; font-weight: 600; text-anchor: middle; }
      .eraSub { fill: #94a3b8; font-size: 12px; text-anchor: middle; }
      .t { fill: #cbd5e1; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .s { fill: #94a3b8; font-size: 11.5px; text-anchor: middle; }
      .axis { stroke: rgba(255,255,255,0.25); stroke-width: 2; }
      .tick { stroke: rgba(255,255,255,0.25); stroke-width: 2; }
      .noteBox { fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.15); stroke-width: 1; }
      .note { fill: #94a3b8; font-size: 12.5px; }
      .key { fill: #c7d2fe; font-size: 13px; }
    </style>
  </defs>

  <text x="600" y="38" class="head">语音合成的三个代际：为什么现在 TTS 能"几秒克隆一个音色"</text>

  <!-- 时间轴 -->
  <line x1="70" y1="88" x2="1130" y2="88" class="axis" />
  <circle cx="340" cy="88" r="7" fill="#94a3b8" />
  <circle cx="700" cy="88" r="7" fill="#38bdf8" />
  <circle cx="1040" cy="88" r="7" fill="#a78bfa" />
  <text class="s" x="340" y="74">~2015 前</text>
  <text class="s" x="700" y="74">2016 — 2022</text>
  <text class="s" x="1040" y="74">2023 至今</text>

  <!-- 第一代 -->
  <rect class="g1" x="60" y="112" width="340" height="250" rx="13" />
  <text class="era" x="230" y="144">第一代 · 拼接与参数合成</text>
  <text class="eraSub" x="230" y="166">把人的声音当"素材"</text>

  <rect class="proj1" x="80" y="184" width="300" height="46" rx="9" />
  <text class="t" x="230" y="203">单元拼接合成</text>
  <text class="s" x="230" y="221">从录音库里挑音素片段拼起来</text>

  <rect class="proj1" x="80" y="240" width="300" height="46" rx="9" />
  <text class="t" x="230" y="259">HMM 参数合成</text>
  <text class="s" x="230" y="277">建模声学参数，再合成波形</text>

  <rect class="proj1" x="80" y="296" width="300" height="46" rx="9" />
  <text class="t" x="230" y="315">代表：Merlin / HTS</text>
  <text class="s" x="230" y="333">机械感明显，换音色要重录数据</text>

  <!-- 第二代 -->
  <rect class="g2" x="430" y="112" width="340" height="250" rx="13" />
  <text class="era" x="600" y="144">第二代 · 神经声学模型</text>
  <text class="eraSub" x="600" y="166">端到端从文本学出波形</text>

  <rect class="proj2" x="450" y="184" width="300" height="46" rx="9" />
  <text class="t" x="600" y="203">Tacotron / FastSpeech</text>
  <text class="s" x="600" y="221">自回归 → 非自回归，速度起飞</text>

  <rect class="proj2" x="450" y="240" width="300" height="46" rx="9" />
  <text class="t" x="600" y="259">VITS / HiFi-GAN</text>
  <text class="s" x="600" y="277">端到端 + 对抗训练，音质大跨步</text>

  <rect class="proj2" x="450" y="296" width="300" height="46" rx="9" />
  <text class="t" x="600" y="315">代表：PaddleSpeech TTS</text>
  <text class="s" x="600" y="333">音质可用，但音色仍需数百句微调</text>

  <!-- 第三代 -->
  <rect class="g3" x="800" y="112" width="340" height="250" rx="13" />
  <text class="era" x="970" y="144">第三代 · 大模型零样本克隆</text>
  <text class="eraSub" x="970" y="166">把语音当 token 来"续写"</text>

  <rect class="proj3" x="820" y="184" width="300" height="46" rx="9" />
  <text class="t" x="970" y="203">CosyVoice / CosyVoice 2</text>
  <text class="s" x="970" y="221">LLM backbone + 流式，指令控制</text>

  <rect class="proj3" x="820" y="240" width="300" height="46" rx="9" />
  <text class="t" x="970" y="259">GPT-SoVITS / Fish Speech</text>
  <text class="s" x="970" y="277">少样本克隆，社区生态活跃</text>

  <rect class="proj3" x="820" y="296" width="300" height="46" rx="9" />
  <text class="t" x="970" y="315">IndexTTS / VoxCPM / F5-TTS</text>
  <text class="s" x="970" y="333">情感与音色可控、解耦</text>

  <!-- 关键变化 -->
  <rect class="noteBox" x="60" y="392" width="1080" height="228" rx="13" />
  <text class="note" x="90" y="422" style="font-weight:600;fill:#c7d2fe;font-size:14px">三代之间真正变了什么</text>

  <text class="key" x="90" y="454">1. 数据要求</text>
  <text class="note" x="230" y="454">数小时录音底库 → 数小时精标数据 → <tspan style="fill:#cbd5e1">3~10 秒参考音频</tspan></text>

  <text class="key" x="90" y="486">2. 换音色的代价</text>
  <text class="note" x="230" y="486">重录重训 → 微调数小时 → <tspan style="fill:#cbd5e1">推理时给一段参考音频即可（zero-shot）</tspan></text>

  <text class="key" x="90" y="518">3. 控制维度</text>
  <text class="note" x="230" y="518">只能控制说什么 → 语速音高 → <tspan style="fill:#cbd5e1">自然语言指令控制情绪、方言、风格</tspan></text>

  <text class="key" x="90" y="550">4. 架构</text>
  <text class="note" x="230" y="550">声学模型 + 声码器两段 → 端到端 → <tspan style="fill:#cbd5e1">语音 token + LLM + 流式解码</tspan></text>

  <text class="key" x="90" y="582">5. 延迟</text>
  <text class="note" x="230" y="582">离线合成 → 数百毫秒 → <tspan style="fill:#cbd5e1">首包 150ms 级别，可双向流式</tspan></text>

  <text class="note" x="90" y="608" style="fill:#a5b4fc">一句话概括：从"训练一个声音"变成"描述一个声音"，参考音频取代了训练数据。</text>
</svg>
