<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="RAG 双链路：离线索引完成解析、切片、嵌入与入库；在线问答完成查询改写、混合召回、重排、上下文组装与生成；向量库承载向量、元数据与权限标签">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .off { fill: rgba(167,139,250,0.15); stroke: rgba(167,139,250,0.5); stroke-width: 1.1; }
      .on { fill: rgba(99,102,241,0.16); stroke: rgba(129,140,248,0.5); stroke-width: 1.1; }
      .store { fill: rgba(255,255,255,0.07); stroke: rgba(167,139,250,0.6); stroke-width: 1.3; }
      .t { fill: #e2e8f0; font-size: 13.5px; text-anchor: middle; }
      .s { fill: #94a3b8; font-size: 11.5px; text-anchor: middle; }
      .storeT { fill: #ddd6fe; font-size: 15px; font-weight: 600; text-anchor: middle; }
      .storeS { fill: #a5b4fc; font-size: 12px; text-anchor: middle; }
      .flow { stroke: #818cf8; stroke-width: 2; fill: none; }
      .flowV { stroke: #a78bfa; stroke-width: 2; fill: none; }
      .side { fill: #a78bfa; font-size: 12.5px; font-weight: 600; }
      .warn { fill: rgba(251,113,133,0.12); stroke: rgba(251,113,133,0.42); stroke-width: 1.1; }
      .warnT { fill: #fecdd3; font-size: 13px; text-anchor: middle; }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#818cf8" />
    </marker>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa" />
    </marker>
  </defs>

  <!-- 离线索引 -->
  <text class="side" transform="rotate(-90 28 106)" x="28" y="106">离线索引</text>
  <rect class="off" x="60" y="76" width="190" height="60" rx="11" />
  <text class="t" x="155" y="102">文档加载</text>
  <text class="s" x="155" y="122">PDF · Word · 扫描件</text>

  <rect class="off" x="285" y="76" width="190" height="60" rx="11" />
  <text class="t" x="380" y="102">解析与清洗</text>
  <text class="s" x="380" y="122">表格 · 多栏 · OCR</text>

  <rect class="off" x="510" y="76" width="190" height="60" rx="11" />
  <text class="t" x="605" y="102">切片</text>
  <text class="s" x="605" y="122">重叠 · 父子块</text>

  <rect class="off" x="735" y="76" width="190" height="60" rx="11" />
  <text class="t" x="830" y="102">嵌入</text>
  <text class="s" x="830" y="122">Embedding 模型</text>

  <rect class="off" x="960" y="76" width="190" height="60" rx="11" />
  <text class="t" x="1055" y="102">入库</text>
  <text class="s" x="1055" y="122">向量 + 元数据</text>

  <line class="flowV" x1="254" y1="106" x2="281" y2="106" marker-end="url(#arv)" />
  <line class="flowV" x1="479" y1="106" x2="506" y2="106" marker-end="url(#arv)" />
  <line class="flowV" x1="704" y1="106" x2="731" y2="106" marker-end="url(#arv)" />
  <line class="flowV" x1="929" y1="106" x2="956" y2="106" marker-end="url(#arv)" />

  <!-- 向量库 -->
  <path class="flowV" d="M1055,140 L1055,168 L600,168 L600,182" marker-end="url(#arv)" />
  <rect class="store" x="200" y="188" width="800" height="82" rx="14" />
  <text class="storeT" x="600" y="218">向量库</text>
  <text class="storeS" x="600" y="242">向量索引（HNSW / IVF）· 元数据过滤 · 权限标签 · 分片与副本</text>

  <!-- 在线问答 -->
  <text class="side" transform="rotate(-90 28 348)" x="28" y="348">在线问答</text>
  <line class="flow" x1="600" y1="274" x2="600" y2="302" />
  <line class="flow" x1="605" y1="302" x2="830" y2="302" />
  <line class="flow" x1="605" y1="302" x2="605" y2="324" marker-end="url(#ar)" />
  <line class="flow" x1="830" y1="302" x2="830" y2="324" marker-end="url(#ar)" />

  <rect class="on" x="60" y="330" width="190" height="60" rx="11" />
  <text class="t" x="155" y="356">用户提问</text>
  <text class="s" x="155" y="376">多轮 · 指代</text>

  <rect class="on" x="285" y="330" width="190" height="60" rx="11" />
  <text class="t" x="380" y="356">查询改写</text>
  <text class="s" x="380" y="376">消解 · 扩展 · HyDE</text>

  <rect class="on" x="510" y="330" width="190" height="60" rx="11" />
  <text class="t" x="605" y="356">混合召回</text>
  <text class="s" x="605" y="376">向量 + BM25</text>

  <rect class="on" x="735" y="330" width="190" height="60" rx="11" />
  <text class="t" x="830" y="356">重排</text>
  <text class="s" x="830" y="376">Cross-Encoder</text>

  <rect class="on" x="960" y="330" width="190" height="60" rx="11" />
  <text class="t" x="1055" y="356">上下文组装</text>
  <text class="s" x="1055" y="376">Top-K 拼装</text>

  <rect class="on" x="735" y="470" width="415" height="60" rx="11" />
  <text class="t" x="942" y="496">生成与引用溯源</text>
  <text class="s" x="942" y="516">强制标注来源 · 无法回答时拒答</text>

  <line class="flow" x1="254" y1="360" x2="281" y2="360" marker-end="url(#ar)" />
  <line class="flow" x1="479" y1="360" x2="506" y2="360" marker-end="url(#ar)" />
  <line class="flow" x1="704" y1="360" x2="731" y2="360" marker-end="url(#ar)" />
  <line class="flow" x1="929" y1="360" x2="956" y2="360" marker-end="url(#ar)" />
  <path class="flow" d="M1055,394 L1055,436 L942,436 L942,466" marker-end="url(#ar)" />

  <!-- 常见失败点 -->
  <rect class="warn" x="60" y="470" width="640" height="60" rx="11" />
  <text class="warnT" x="380" y="496">常见失败点：召回不到 · 排序错位 · 生成忽略上下文</text>
  <text class="warnT" x="380" y="516">多版本冲突 · 权限越界</text>
</svg>
