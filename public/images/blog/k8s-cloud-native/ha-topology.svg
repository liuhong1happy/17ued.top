<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="跨可用区高可用拓扑：负载均衡分布在三个可用区，控制面 etcd 跨区部署，工作负载按可用区打散，配跨区存储与备份">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .lb { fill: rgba(99,102,241,0.20); stroke: rgba(129,140,248,0.6); stroke-width: 1.3; }
      .lbText { fill: #e2e8f0; font-size: 16px; font-weight: 600; text-anchor: middle; }
      .az { fill: rgba(255,255,255,0.04); stroke: rgba(255,255,255,0.16); stroke-width: 1.2; stroke-dasharray: 6 5; }
      .azName { fill: #c7d2fe; font-size: 14.5px; font-weight: 600; text-anchor: middle; }
      .cp { fill: rgba(167,139,250,0.16); stroke: rgba(167,139,250,0.5); stroke-width: 1.1; }
      .cpText { fill: #ddd6fe; font-size: 13px; text-anchor: middle; }
      .node { fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.18); stroke-width: 1.1; }
      .nodeLabel { fill: #94a3b8; font-size: 11.5px; }
      .pod { fill: rgba(99,102,241,0.22); stroke: rgba(129,140,248,0.55); stroke-width: 1; }
      .podText { fill: #c7d2fe; font-size: 11.5px; text-anchor: middle; }
      .bus { stroke: #818cf8; stroke-width: 2; fill: none; }
      .store { fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.16); stroke-width: 1.2; }
      .storeText { fill: #cbd5e1; font-size: 13.5px; text-anchor: middle; }
      .note { fill: #a78bfa; font-size: 13px; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#818cf8" />
    </marker>
  </defs>

  <!-- 入口 -->
  <rect class="lb" x="380" y="26" width="440" height="58" rx="14" />
  <text class="lbText" x="600" y="62">负载均衡 · 多可用区入口（DNS / GSLB）</text>

  <!-- 分发总线 -->
  <path class="bus" d="M600,84 L600,110" />
  <line class="bus" x1="220" y1="110" x2="980" y2="110" />
  <line class="bus" x1="220" y1="110" x2="220" y2="132" marker-end="url(#arrow)" />
  <line class="bus" x1="600" y1="110" x2="600" y2="132" marker-end="url(#arrow)" />
  <line class="bus" x1="980" y1="110" x2="980" y2="132" marker-end="url(#arrow)" />

  <!-- 可用区 A -->
  <rect class="az" x="50" y="136" width="340" height="296" rx="16" />
  <text class="azName" x="220" y="162">可用区 A</text>
  <rect class="cp" x="70" y="180" width="300" height="62" rx="11" />
  <text class="cpText" x="220" y="205">控制面节点</text>
  <text class="cpText" x="220" y="226">kube-apiserver · etcd</text>
  <rect class="node" x="70" y="254" width="300" height="64" rx="11" />
  <text class="nodeLabel" x="84" y="274">Node 1</text>
  <rect class="pod" x="86" y="282" width="130" height="26" rx="7" />
  <text class="podText" x="151" y="299">Pod · api-gateway</text>
  <rect class="pod" x="226" y="282" width="130" height="26" rx="7" />
  <text class="podText" x="291" y="299">Pod · api-gateway</text>
  <rect class="node" x="70" y="326" width="300" height="64" rx="11" />
  <text class="nodeLabel" x="84" y="346">Node 2</text>
  <rect class="pod" x="86" y="354" width="130" height="26" rx="7" />
  <text class="podText" x="151" y="371">Pod · api-gateway</text>
  <rect class="pod" x="226" y="354" width="130" height="26" rx="7" />
  <text class="podText" x="291" y="371">Pod · order-svc</text>

  <!-- 可用区 B -->
  <rect class="az" x="430" y="136" width="340" height="296" rx="16" />
  <text class="azName" x="600" y="162">可用区 B</text>
  <rect class="cp" x="450" y="180" width="300" height="62" rx="11" />
  <text class="cpText" x="600" y="205">控制面节点</text>
  <text class="cpText" x="600" y="226">kube-apiserver · etcd</text>
  <rect class="node" x="450" y="254" width="300" height="64" rx="11" />
  <text class="nodeLabel" x="464" y="274">Node 1</text>
  <rect class="pod" x="466" y="282" width="130" height="26" rx="7" />
  <text class="podText" x="531" y="299">Pod · api-gateway</text>
  <rect class="pod" x="606" y="282" width="130" height="26" rx="7" />
  <text class="podText" x="671" y="299">Pod · order-svc</text>
  <rect class="node" x="450" y="326" width="300" height="64" rx="11" />
  <text class="nodeLabel" x="464" y="346">Node 2</text>
  <rect class="pod" x="466" y="354" width="130" height="26" rx="7" />
  <text class="podText" x="531" y="371">Pod · api-gateway</text>
  <rect class="pod" x="606" y="354" width="130" height="26" rx="7" />
  <text class="podText" x="671" y="371">Pod · order-svc</text>

  <!-- 可用区 C -->
  <rect class="az" x="810" y="136" width="340" height="296" rx="16" />
  <text class="azName" x="980" y="162">可用区 C</text>
  <rect class="cp" x="830" y="180" width="300" height="62" rx="11" />
  <text class="cpText" x="980" y="205">控制面节点</text>
  <text class="cpText" x="980" y="226">kube-apiserver · etcd</text>
  <rect class="node" x="830" y="254" width="300" height="64" rx="11" />
  <text class="nodeLabel" x="844" y="274">Node 1</text>
  <rect class="pod" x="846" y="282" width="130" height="26" rx="7" />
  <text class="podText" x="911" y="299">Pod · api-gateway</text>
  <rect class="pod" x="986" y="282" width="130" height="26" rx="7" />
  <text class="podText" x="1051" y="299">Pod · order-svc</text>
  <rect class="node" x="830" y="326" width="300" height="64" rx="11" />
  <text class="nodeLabel" x="844" y="346">Node 2</text>
  <rect class="pod" x="846" y="354" width="130" height="26" rx="7" />
  <text class="podText" x="911" y="371">Pod · order-svc</text>
  <rect class="pod" x="986" y="354" width="130" height="26" rx="7" />
  <text class="podText" x="1051" y="371">Pod · api-gateway</text>

  <!-- 存储与备份 -->
  <rect class="store" x="50" y="470" width="1100" height="76" rx="14" />
  <text class="storeText" x="600" y="500">分布式存储（Ceph / 云盘 CSI）· 快照与离线恢复验证 · 跨集群备份 Velero</text>
  <text class="storeText" x="600" y="526">存储与备份独立于任一故障域，PV 回收策略统一为 Retain</text>

  <text class="note" x="600" y="592">任一可用区整体故障，剩余两个可用区仍满足 PodDisruptionBudget 的 minAvailable 约束</text>
</svg>
