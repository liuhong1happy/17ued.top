<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="语音交互的两条技术路线：级联式的 VAD、ASR、轮次检测、LLM、TTS 流水线，与端到端的语音 Tokenizer、语音大模型、解码器">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .stage { fill: rgba(99,102,241,0.16); stroke: rgba(129,140,248,0.5); stroke-width: 1.2; }
      .stageIo { fill: rgba(148,163,184,0.15); stroke: rgba(148,163,184,0.45); stroke-width: 1.2; }
      .stageKey { fill: rgba(167,139,250,0.20); stroke: rgba(167,139,250,0.6); stroke-width: 1.3; }
      .e2e { fill: rgba(56,189,248,0.16); stroke: rgba(56,189,248,0.5); stroke-width: 1.2; }
      .e2eKey { fill: rgba(52,211,153,0.18); stroke: rgba(52,211,153,0.6); stroke-width: 1.3; }
      .head { fill: #e2e8f0; font-size: 19px; font-weight: 600; text-anchor: middle; }
      .secHead { fill: #c7d2fe; font-size: 16px; font-weight: 600; }
      .secHeadE2e { fill: #7dd3fc; font-size: 16px; font-weight: 600; }
      .t { fill: #e2e8f0; font-size: 13.5px; font-weight: 600; text-anchor: middle; }
      .s { fill: #94a3b8; font-size: 11.5px; text-anchor: middle; }
      .flow { stroke: #818cf8; stroke-width: 2; fill: none; }
      .flowE { stroke: #38bdf8; stroke-width: 2; fill: none; }
      .note { fill: #94a3b8; font-size: 12.5px; }
      .noteBox { fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.15); stroke-width: 1; }
      .bad { fill: #f9a8d4; font-size: 12.5px; }
      .good { fill: #6ee7b7; font-size: 12.5px; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#818cf8" />
    </marker>
    <marker id="ahe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8" />
    </marker>
  </defs>

  <text x="600" y="38" class="head">语音交互的两条路线</text>

  <!-- 级联 -->
  <text x="50" y="80" class="secHead">级联式（Cascaded）：每一环都能单独替换</text>

  <rect class="stageIo" x="50" y="98" width="130" height="72" rx="10" />
  <text class="t" x="115" y="128">麦克风</text>
  <text class="s" x="115" y="150">音频采集</text>

  <rect class="stage" x="200" y="98" width="130" height="72" rx="10" />
  <text class="t" x="265" y="128">VAD</text>
  <text class="s" x="265" y="150">端点检测</text>

  <rect class="stageKey" x="350" y="98" width="130" height="72" rx="10" />
  <text class="t" x="415" y="128">ASR</text>
  <text class="s" x="415" y="150">语音转文字</text>

  <rect class="stage" x="500" y="98" width="130" height="72" rx="10" />
  <text class="t" x="565" y="128">轮次检测</text>
  <text class="s" x="565" y="150">标点 / 断句</text>

  <rect class="stage" x="650" y="98" width="130" height="72" rx="10" />
  <text class="t" x="715" y="128">LLM</text>
  <text class="s" x="715" y="150">理解与生成</text>

  <rect class="stageKey" x="800" y="98" width="130" height="72" rx="10" />
  <text class="t" x="865" y="128">TTS</text>
  <text class="s" x="865" y="150">文字转语音</text>

  <rect class="stageIo" x="950" y="98" width="200" height="72" rx="10" />
  <text class="t" x="1050" y="128">扬声器</text>
  <text class="s" x="1050" y="150">音频播放 / 打断控制</text>

  <path class="flow" d="M184,134 L196,134" marker-end="url(#ah)" />
  <path class="flow" d="M334,134 L346,134" marker-end="url(#ah)" />
  <path class="flow" d="M484,134 L496,134" marker-end="url(#ah)" />
  <path class="flow" d="M634,134 L646,134" marker-end="url(#ah)" />
  <path class="flow" d="M784,134 L796,134" marker-end="url(#ah)" />
  <path class="flow" d="M934,134 L946,134" marker-end="url(#ah)" />

  <text class="note" x="50" y="196">每一环都可以换成不同的开源实现 —— 这正是国内开源生态最活跃的地方：ASR 换 FunASR，TTS 换 CosyVoice，互不影响。</text>
  <text class="bad" x="50" y="220">代价：文字是有损压缩，韵律、情绪、语气在 ASR 转文字时就丢了；错误还会沿链路累积。</text>

  <line x1="40" y1="248" x2="1160" y2="248" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- 端到端 -->
  <text x="50" y="284" class="secHeadE2e">端到端（End-to-End）：语音进、语音出</text>

  <rect class="stageIo" x="70" y="304" width="160" height="84" rx="10" />
  <text class="t" x="150" y="338">麦克风</text>
  <text class="s" x="150" y="360">连续音频流</text>

  <rect class="e2e" x="260" y="304" width="200" height="84" rx="10" />
  <text class="t" x="360" y="338">Speech Tokenizer</text>
  <text class="s" x="360" y="360">音频 → 离散 token</text>

  <rect class="e2eKey" x="490" y="304" width="220" height="84" rx="10" />
  <text class="t" x="600" y="338">语音大模型 LLM</text>
  <text class="s" x="600" y="360">直接生成语音 token</text>

  <rect class="e2e" x="740" y="304" width="200" height="84" rx="10" />
  <text class="t" x="840" y="338">Detokenizer</text>
  <text class="s" x="840" y="360">token → 波形（Flow Matching）</text>

  <rect class="stageIo" x="970" y="304" width="160" height="84" rx="10" />
  <text class="t" x="1050" y="338">扬声器</text>
  <text class="s" x="1050" y="360">可全双工</text>

  <path class="flowE" d="M234,346 L256,346" marker-end="url(#ahe)" />
  <path class="flowE" d="M464,346 L486,346" marker-end="url(#ahe)" />
  <path class="flowE" d="M714,346 L736,346" marker-end="url(#ahe)" />
  <path class="flowE" d="M944,346 L966,346" marker-end="url(#ahe)" />

  <text class="good" x="70" y="418">保留了副语言信息（语气、情绪、停顿），延迟可以做得很低，也能做全双工（边听边说）。</text>
  <text class="bad" x="70" y="442">代价：整条链路绑定成一个模型，换一个组件就要重训；工具调用、知识库接入不如级联式灵活。</text>

  <!-- 对比小结 -->
  <rect class="noteBox" x="50" y="474" width="1100" height="120" rx="12" />
  <text class="note" x="80" y="504" style="font-weight:600;fill:#c7d2fe">怎么选（工程上的现实答案）</text>
  <text class="note" x="80" y="530">· 要接知识库、调工具、走业务流程 → <tspan style="fill:#cbd5e1">级联式</tspan>。可控、可观测、可替换，出问题能定位到具体环节。</text>
  <text class="note" x="80" y="554">· 要拟人化闲聊、情绪陪伴、极致低延迟 → <tspan style="fill:#cbd5e1">端到端</tspan>。</text>
  <text class="note" x="80" y="578">· 大多数生产系统采用折中：级联式为主干，关键环节用大模型增强（如语义轮次检测、情绪化 TTS）。</text>
</svg>
