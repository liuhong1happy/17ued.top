<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-label="自我改进环路：线上运行、采集 trace 与指标、失败归因聚类、提出改动、离线回归集验证、人工审合并，其中只有人工审合并与受约束的提出改动必须留人">
  <defs>
    <marker id="s-slate" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
    <marker id="s-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="760" height="450" fill="#0f172a"/>
  <text x="24" y="32" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#94a3b8">自我改进的环路：哪些环节能交给 Agent 自己做</text>

  <!-- 第一行 -->
  <rect x="30" y="80" width="210" height="58" rx="10" fill="#151d33" stroke="#2b3a55"/>
  <rect x="30" y="80" width="4" height="58" rx="2" fill="#34d399"/>
  <text x="146" y="103" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#dbe3f0">线上运行</text>
  <text x="146" y="126" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#6ee7b7">全自动</text>
  <line x1="240" y1="109" x2="271" y2="109" stroke="#64748b" stroke-width="1.5" marker-end="url(#s-slate)"/>

  <rect x="275" y="80" width="210" height="58" rx="10" fill="#151d33" stroke="#2b3a55"/>
  <rect x="275" y="80" width="4" height="58" rx="2" fill="#34d399"/>
  <text x="391" y="103" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#dbe3f0">采集 trace 与指标</text>
  <text x="391" y="126" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#6ee7b7">全自动</text>
  <line x1="485" y1="109" x2="516" y2="109" stroke="#64748b" stroke-width="1.5" marker-end="url(#s-slate)"/>

  <rect x="520" y="80" width="210" height="58" rx="10" fill="#151d33" stroke="#2b3a55"/>
  <rect x="520" y="80" width="4" height="58" rx="2" fill="#34d399"/>
  <text x="636" y="103" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#dbe3f0">失败归因 · 聚类</text>
  <text x="636" y="126" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#6ee7b7">全自动</text>

  <!-- 下行 -->
  <line x1="625" y1="138" x2="625" y2="286" stroke="#64748b" stroke-width="1.5" marker-end="url(#s-slate)"/>

  <!-- 第二行（自右向左） -->
  <rect x="520" y="290" width="210" height="58" rx="10" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.4"/>
  <rect x="520" y="290" width="4" height="58" rx="2" fill="#fbbf24"/>
  <text x="636" y="313" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#fbbf24">提出改动</text>
  <text x="636" y="336" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#c9a35f">半自动 · 受回归集约束</text>
  <line x1="520" y1="319" x2="489" y2="319" stroke="#64748b" stroke-width="1.5" marker-end="url(#s-slate)"/>

  <rect x="275" y="290" width="210" height="58" rx="10" fill="#151d33" stroke="#2b3a55"/>
  <rect x="275" y="290" width="4" height="58" rx="2" fill="#34d399"/>
  <text x="391" y="313" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#dbe3f0">离线回归集验证</text>
  <text x="391" y="336" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#6ee7b7">全自动 · 集子冻结</text>
  <line x1="275" y1="319" x2="244" y2="319" stroke="#64748b" stroke-width="1.5" marker-end="url(#s-slate)"/>

  <rect x="30" y="290" width="210" height="58" rx="10" fill="#fb7185" fill-opacity="0.10" stroke="#fb7185" stroke-opacity="0.45"/>
  <rect x="30" y="290" width="4" height="58" rx="2" fill="#fb7185"/>
  <text x="146" y="313" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#fb7185">人工审合并</text>
  <text x="146" y="336" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#c98a97">必须留人</text>

  <!-- 回边 -->
  <line x1="135" y1="286" x2="135" y2="142" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#s-amber)"/>

  <!-- 结论 -->
  <rect x="30" y="384" width="700" height="46" rx="10" fill="#94a3b8" fill-opacity="0.07" stroke="#2b3a55"/>
  <text x="52" y="412" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#a9b7cc">被评估的对象不能修改评估本身——回归集由外部管理，Agent 只能往里加 case，不能删、不能改期望</text>
</svg>
