<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="GB/T 28181 联网体系结构：前端设备通过 SIP 信令注册到平台的信令服务器，媒体流由流媒体服务器接收分发，平台之间可以级联">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .head { fill: #e2e8f0; font-size: 20px; font-weight: 600; text-anchor: middle; }
      .frame { fill: rgba(99,102,241,0.10); stroke: rgba(129,140,248,0.45); stroke-width: 1.3; }
      .boxSig { fill: rgba(99,102,241,0.20); stroke: rgba(129,140,248,0.6); stroke-width: 1.2; }
      .boxMed { fill: rgba(52,211,153,0.16); stroke: rgba(52,211,153,0.55); stroke-width: 1.2; }
      .boxCli { fill: rgba(56,189,248,0.15); stroke: rgba(56,189,248,0.5); stroke-width: 1.2; }
      .boxDev { fill: rgba(148,163,184,0.12); stroke: rgba(148,163,184,0.4); stroke-width: 1.2; }
      .boxUp  { fill: rgba(167,139,250,0.18); stroke: rgba(167,139,250,0.6); stroke-width: 1.3; }
      .t { fill: #e2e8f0; font-size: 14.5px; font-weight: 600; text-anchor: middle; }
      .s { fill: #94a3b8; font-size: 11.5px; text-anchor: middle; }
      .frameTx { fill: #c7d2fe; font-size: 14px; font-weight: 600; }
      .zoneTx { fill: #64748b; font-size: 12.5px; font-weight: 600; }
      .aSig { stroke: #818cf8; stroke-width: 2; fill: none; }
      .aMed { stroke: #34d399; stroke-width: 2.4; fill: none; }
      .aUp { stroke: #a78bfa; stroke-width: 2; fill: none; }
      .lblSig { fill: #c7d2fe; font-size: 11.5px; }
      .lblMed { fill: #6ee7b7; font-size: 11.5px; }
      .lblUp { fill: #c4b5fd; font-size: 11.5px; }
      .noteBox { fill: rgba(255,255,255,0.04); stroke: rgba(255,255,255,0.14); stroke-width: 1; }
      .note { fill: #94a3b8; font-size: 13px; text-anchor: middle; }
    </style>
    <marker id="pSig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#818cf8" />
    </marker>
    <marker id="pMed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399" />
    </marker>
    <marker id="pUp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa" />
    </marker>
  </defs>

  <text x="600" y="32" class="head">GB/T 28181 联网体系结构</text>

  <!-- 上级平台 -->
  <rect class="boxUp" x="380" y="56" width="440" height="76" rx="12" />
  <text class="t" x="600" y="88">上级平台</text>
  <text class="s" x="600" y="110">本级平台以「一台设备」的身份注册上去</text>

  <!-- 级联 -->
  <line class="aUp" x1="600" y1="206" x2="600" y2="138" marker-end="url(#pUp)" />
  <text class="lblUp" x="614" y="164">级联（下级向上级注册，信息流复用设备接入机制）</text>

  <!-- 本级平台 -->
  <rect class="frame" x="50" y="210" width="1100" height="180" rx="14" />
  <text class="frameTx" x="76" y="238">本级平台</text>

  <rect class="boxSig" x="90" y="262" width="330" height="104" rx="10" />
  <text class="t" x="255" y="300">SIP 信令控制服务器</text>
  <text class="s" x="255" y="322">注册 · 鉴权 · 目录 · 点播信令</text>
  <text class="s" x="255" y="344">编码以类型 200 结尾</text>

  <rect class="boxMed" x="440" y="262" width="330" height="104" rx="10" />
  <text class="t" x="605" y="300">流媒体服务器</text>
  <text class="s" x="605" y="322">接收 PS 流 · 转封装 · 分发</text>
  <text class="s" x="605" y="344">ZLMediaKit / SRS</text>

  <rect class="boxCli" x="790" y="262" width="320" height="104" rx="10" />
  <text class="t" x="950" y="300">客户端</text>
  <text class="s" x="950" y="322">点播 · 云台 · 回放</text>
  <text class="s" x="950" y="344">Web / PC / 移动端</text>

  <!-- 前端设备 -->
  <text class="zoneTx" x="76" y="450">前端设备</text>
  <rect class="boxDev" x="90" y="478" width="330" height="90" rx="10" />
  <text class="t" x="255" y="514">网络摄像机 IPC</text>
  <text class="s" x="255" y="536">编码以类型 132 结尾</text>

  <rect class="boxDev" x="440" y="478" width="330" height="90" rx="10" />
  <text class="t" x="605" y="514">硬盘录像机 NVR</text>
  <text class="s" x="605" y="536">下挂多路通道</text>

  <rect class="boxDev" x="790" y="478" width="320" height="90" rx="10" />
  <text class="t" x="950" y="514">视频编码器</text>
  <text class="s" x="950" y="536">模拟设备数字化接入</text>

  <!-- 信令与媒体两条通路 -->
  <line class="aSig" x1="255" y1="474" x2="255" y2="370" marker-end="url(#pSig)" />
  <text class="lblSig" x="266" y="430">SIP 信令：注册 / 心跳 / 目录 / 点播（5060）</text>

  <line class="aMed" x1="605" y1="474" x2="605" y2="370" marker-end="url(#pMed)" />
  <text class="lblMed" x="616" y="430">PS over RTP 媒体流</text>

  <rect class="noteBox" x="50" y="592" width="1100" height="50" rx="12" />
  <text class="note" x="600" y="623">信令与媒体是两条独立通路，通常由两个独立进程承担 —— 信令通不代表媒体通</text>
</svg>
