<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Sol-H3 加速栈分层：应用层之下是 Sol-Attn 免训练稀疏注意力，再往下是 Sol-Engine 的系统级优化（核融合、通信量化、VAE 并行解码、AdaLN 缓存），最底层是 B300 与 DGX Spark 等硬件">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .app { fill: rgba(52,211,153,0.10); stroke: rgba(52,211,153,0.42); stroke-width: 1.2; }
      .attn { fill: rgba(167,139,250,0.14); stroke: rgba(167,139,250,0.55); stroke-width: 1.4; }
      .eng { fill: rgba(99,102,241,0.12); stroke: rgba(129,140,248,0.5); stroke-width: 1.3; }
      .hw { fill: rgba(148,163,184,0.10); stroke: rgba(148,163,184,0.42); stroke-width: 1.2; }
      .sub { fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.14); stroke-width: 1; }
      .t { fill: #e2e8f0; font-size: 16px; font-weight: 600; }
      .ts { fill: #94a3b8; font-size: 12.5px; }
      .tv { fill: #cbd5e1; font-size: 12.5px; }
      .tk { fill: #c7d2fe; font-size: 12.5px; font-weight: 600; }
      .tp { fill: #c4b5fd; font-size: 12.5px; font-weight: 600; }
      .subT { fill: #cbd5e1; font-size: 12px; text-anchor: middle; }
      .subK { fill: #e2e8f0; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .note { fill: #94a3b8; font-size: 12.5px; }
    </style>
  </defs>

  <!-- 应用层 -->
  <rect class="app" x="30" y="24" width="1140" height="76" rx="14" />
  <text class="t" x="56" y="58">应用层</text>
  <text class="ts" x="56" y="82">实时视频生成 · 视频编辑（换角色、改动作、对口型）· 交互式创作</text>
  <text class="tk" x="1146" y="58" text-anchor="end">目标：端到端延迟 &lt; 视频时长</text>

  <!-- Sol-Attn -->
  <rect class="attn" x="30" y="116" width="1140" height="128" rx="14" />
  <text class="t" x="56" y="150">Sol-Attn · 免训练稀疏注意力</text>
  <text class="tv" x="56" y="176">① 用轻量 query–key 打分算阈值 <tspan fill="#c4b5fd" font-weight="600">τ = mean + τ系数 × std</tspan>，逐 query 自适应</text>
  <text class="tv" x="56" y="200">② 选中的 64-token 块做精确注意力；跳过的块用池化 K/V 摘要做近似修正</text>
  <text class="tv" x="56" y="224">③ 路由、稀疏计算、修正共用同一次 online-softmax，不物化路由图，不需要重训</text>
  <text class="tp" x="1146" y="224" text-anchor="end">CuTe 核：SM90 / SM100 / SM120，另有 Triton 回退</text>

  <!-- Sol-Engine -->
  <rect class="eng" x="30" y="260" width="1140" height="168" rx="14" />
  <text class="t" x="56" y="294">Sol-Engine · 系统级优化</text>

  <rect class="sub" x="56" y="312" width="262" height="96" rx="12" />
  <text class="subK" x="187" y="340">核融合</text>
  <text class="subT" x="187" y="364">SwiGLU / QK-Norm</text>
  <text class="subT" x="187" y="386">+ partial RoPE 合并</text>

  <rect class="sub" x="336" y="312" width="262" height="96" rx="12" />
  <text class="subK" x="467" y="340">通信量化</text>
  <text class="subT" x="467" y="364">Ulysses all-to-all</text>
  <text class="subT" x="467" y="386">INT8 / FP8 打包交换</text>

  <rect class="sub" x="616" y="312" width="262" height="96" rx="12" />
  <text class="subK" x="747" y="340">缓存与解码</text>
  <text class="subT" x="747" y="364">AdaLN 预计算缓存</text>
  <text class="subT" x="747" y="386">VAE 分块并行解码</text>

  <rect class="sub" x="896" y="312" width="250" height="96" rx="12" />
  <text class="subK" x="1021" y="340">编译与调度</text>
  <text class="subT" x="1021" y="364">图编译 · kernel 自动</text>
  <text class="subT" x="1021" y="386">搜索 · 显存布局</text>

  <!-- 硬件 -->
  <rect class="hw" x="30" y="444" width="1140" height="76" rx="14" />
  <text class="t" x="56" y="478">硬件</text>
  <text class="ts" x="56" y="502">8×B300（云端吞吐）· 4× / 1×B300（单机）· 单台 DGX Spark（边缘）</text>
  <text class="note" x="1146" y="478" text-anchor="end">同一套栈，靠规模换延迟</text>

  <text class="note" x="30" y="546">注：Sol-Attn 只跳过「算完也几乎不改变结果」的块，并用摘要补回被跳过的注意力质量；因此它不需要为了稀疏而重新训练模型。</text>
</svg>
