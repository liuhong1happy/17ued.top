<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="TypeScript 类型系统分层：基础类型与字面量、组合与抽象、条件与映射类型、工程保障，类型只在编译期存在，运行时仍需校验">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .head { fill: #e2e8f0; font-size: 20px; font-weight: 600; text-anchor: middle; }
      .sub { fill: #94a3b8; font-size: 12.5px; text-anchor: middle; }
      .c1 { fill: rgba(56,189,248,0.12); stroke: rgba(56,189,248,0.45); stroke-width: 1.2; }
      .c2 { fill: rgba(99,102,241,0.14); stroke: rgba(129,140,248,0.5); stroke-width: 1.2; }
      .c3 { fill: rgba(167,139,250,0.14); stroke: rgba(167,139,250,0.5); stroke-width: 1.2; }
      .c4 { fill: rgba(52,211,153,0.13); stroke: rgba(52,211,153,0.45); stroke-width: 1.2; }
      .t { fill: #e2e8f0; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .s { fill: #94a3b8; font-size: 11px; text-anchor: middle; }
      .b { fill: #7dd3fc; font-size: 11.5px; }
      .p { fill: #c4b5fd; font-size: 11.5px; }
      .g { fill: #6ee7b7; font-size: 11.5px; }
      .y { fill: #fcd34d; font-size: 11.5px; }
      .note { fill: #94a3b8; font-size: 11.5px; }
      .flow { stroke: #818cf8; stroke-width: 2; fill: none; }
      .box { fill: rgba(255,255,255,0.04); stroke: rgba(255,255,255,0.13); stroke-width: 1; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#818cf8" />
    </marker>
  </defs>

  <text x="600" y="32" class="head">TypeScript 类型系统的四层</text>
  <text x="600" y="56" class="sub">从「描述数据」到「变换类型」，再到「工程约束」；类型只在编译期存在</text>

  <!-- four columns -->
  <rect class="c1" x="40" y="90" width="250" height="400" rx="12" />
  <text class="t" x="165" y="120">① 基础类型</text>
  <text class="s" x="165" y="142">描述数据形状</text>
  <text class="b" x="60" y="178">string / number / boolean</text>
  <text class="b" x="60" y="204">null / undefined / bigint</text>
  <text class="b" x="60" y="230">object / array / tuple</text>
  <text class="b" x="60" y="256">字面量类型 "a" | 42 | true</text>
  <text class="b" x="60" y="282">联合 A | B</text>
  <text class="b" x="60" y="308">交叉 A &amp; B</text>
  <text class="b" x="60" y="334">可选 ? / 只读 readonly</text>
  <text class="b" x="60" y="360">interface / type</text>
  <rect class="box" x="60" y="390" width="210" height="76" rx="8" />
  <text class="note" x="76" y="414">例：</text>
  <text class="note" x="76" y="436">type Status =</text>
  <text class="note" x="76" y="454">  "idle" | "loading" | "done"</text>

  <line class="flow" x1="290" y1="290" x2="326" y2="290" marker-end="url(#a)" />

  <!-- column 2 -->
  <rect class="c2" x="330" y="90" width="250" height="400" rx="12" />
  <text class="t" x="455" y="120">② 组合与抽象</text>
  <text class="s" x="455" y="142">让类型可参数化</text>
  <text class="p" x="350" y="178">泛型 &lt;T&gt;</text>
  <text class="p" x="350" y="204">约束 T extends U</text>
  <text class="p" x="350" y="230">默认值 &lt;T = unknown&gt;</text>
  <text class="p" x="350" y="256">keyof T</text>
  <text class="p" x="350" y="282">typeof value</text>
  <text class="p" x="350" y="308">索引访问 T[K]</text>
  <text class="p" x="350" y="334">泛型接口 / 泛型组件</text>
  <rect class="box" x="350" y="390" width="210" height="76" rx="8" />
  <text class="note" x="366" y="414">例：</text>
  <text class="note" x="366" y="436">function pluck&lt;T, K extends keyof T&gt;</text>
  <text class="note" x="366" y="454">  (items: T[], key: K): T[K][]</text>

  <line class="flow" x1="580" y1="290" x2="616" y2="290" marker-end="url(#a)" />

  <!-- column 3 -->
  <rect class="c3" x="620" y="90" width="250" height="400" rx="12" />
  <text class="t" x="745" y="120">③ 类型变换</text>
  <text class="s" x="745" y="142">在编译期计算类型</text>
  <text class="p" x="640" y="178">条件 T extends U ? X : Y</text>
  <text class="p" x="640" y="204">infer 提取</text>
  <text class="p" x="640" y="230">分布式条件类型</text>
  <text class="p" x="640" y="256">映射 &#123;[K in keyof T]&#125;</text>
  <text class="p" x="640" y="282">key remapping as</text>
  <text class="p" x="640" y="308">模板字面量 `on${Capitalize&lt;K&gt;}`</text>
  <text class="p" x="640" y="334">工具类型 Partial/Pick/Omit</text>
  <rect class="box" x="640" y="390" width="210" height="76" rx="8" />
  <text class="note" x="656" y="414">例：</text>
  <text class="note" x="656" y="436">type Unwrap&lt;T&gt; =</text>
  <text class="note" x="656" y="454">  T extends Promise&lt;infer U&gt; ? U : T</text>

  <line class="flow" x1="870" y1="290" x2="906" y2="290" marker-end="url(#a)" />

  <!-- column 4 -->
  <rect class="c4" x="910" y="90" width="250" height="400" rx="12" />
  <text class="t" x="1035" y="120">④ 工程保障</text>
  <text class="s" x="1035" y="142">让错误尽早暴露</text>
  <text class="g" x="930" y="178">strict: true</text>
  <text class="g" x="930" y="204">noUncheckedIndexedAccess</text>
  <text class="g" x="930" y="230">exactOptionalPropertyTypes</text>
  <text class="g" x="930" y="256">satisfies 校验</text>
  <text class="g" x="930" y="282">as const 收窄</text>
  <text class="g" x="930" y="308">品牌类型 Brand</text>
  <text class="g" x="930" y="334">运行时校验 zod / valibot</text>
  <rect class="box" x="930" y="390" width="210" height="76" rx="8" />
  <text class="note" x="946" y="414">边界：</text>
  <text class="note" x="946" y="436">const json: unknown =</text>
  <text class="note" x="946" y="454">  await res.json(); // 必须校验</text>

  <!-- bottom -->
  <rect class="box" x="40" y="520" width="1120" height="140" rx="12" />
  <text class="g" x="62" y="548">两条底线</text>
  <text class="note" x="62" y="576">1. 类型在编译后被擦除：interface、泛型、as 都不会产生运行时检查。</text>
  <text class="note" x="62" y="600">2. 外部数据必须运行时校验：JSON.parse、fetch、localStorage、URL 参数都是 unknown 的来源。</text>
  <text class="y" x="62" y="630">「类型声明」是契约，「运行时校验」是履约；两者缺一不可。</text>
</svg>
