<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="H3-Base 单流 Omni Transformer 结构：文本、视频潜变量与音频潜变量打包成一条序列，送入共享的 50 层 Transformer 联合去噪，AdaLN 分支因只依赖时间步嵌入而可预计算缓存">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .segText { fill: rgba(52,211,153,0.20); stroke: rgba(52,211,153,0.5); stroke-width: 1; }
      .segVid { fill: rgba(99,102,241,0.22); stroke: rgba(129,140,248,0.55); stroke-width: 1; }
      .segAud { fill: rgba(167,139,250,0.22); stroke: rgba(167,139,250,0.55); stroke-width: 1; }
      .core { fill: rgba(99,102,241,0.12); stroke: rgba(129,140,248,0.5); stroke-width: 1.3; }
      .side { fill: rgba(251,191,36,0.10); stroke: rgba(251,191,36,0.45); stroke-width: 1.2; stroke-dasharray: 6 5; }
      .vae { fill: rgba(52,211,153,0.10); stroke: rgba(52,211,153,0.42); stroke-width: 1.2; }
      .flow { stroke: #818cf8; stroke-width: 2; fill: none; }
      .t { fill: #e2e8f0; font-size: 15px; font-weight: 600; text-anchor: middle; }
      .ts { fill: #94a3b8; font-size: 12px; text-anchor: middle; }
      .tk { fill: #c7d2fe; font-size: 12.5px; font-weight: 600; }
      .ty { fill: #fcd34d; font-size: 12.5px; font-weight: 600; }
      .tv { fill: #cbd5e1; font-size: 12.5px; }
      .lbl { font-size: 11.5px; text-anchor: middle; font-weight: 600; }
      .note { fill: #94a3b8; font-size: 12.5px; }
    </style>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#818cf8" />
    </marker>
  </defs>

  <text class="tk" x="30" y="34">① 打包：三类 token 串成一条序列</text>

  <!-- packed sequence -->
  <rect class="segText" x="60" y="48" width="130" height="58" rx="8" />
  <text class="lbl" x="125" y="74" fill="#6ee7b7">文本</text>
  <text class="ts" x="125" y="94">Qwen3-VL-32B 特征</text>

  <rect class="segVid" x="194" y="48" width="130" height="58" rx="8" />
  <text class="lbl" x="259" y="74" fill="#a5b4fc">视频</text>
  <text class="ts" x="259" y="94">VisualVAE latent</text>

  <rect class="segAud" x="328" y="48" width="130" height="58" rx="8" />
  <text class="lbl" x="393" y="74" fill="#c4b5fd">音频</text>
  <text class="ts" x="393" y="94">AudioVAE latent</text>

  <rect class="segVid" x="462" y="48" width="130" height="58" rx="8" />
  <text class="lbl" x="527" y="74" fill="#a5b4fc">视频</text>
  <text class="ts" x="527" y="94">VisualVAE latent</text>

  <rect class="segAud" x="596" y="48" width="130" height="58" rx="8" />
  <text class="lbl" x="661" y="74" fill="#c4b5fd">音频</text>
  <text class="ts" x="661" y="94">AudioVAE latent</text>

  <rect class="segVid" x="730" y="48" width="130" height="58" rx="8" />
  <text class="lbl" x="795" y="74" fill="#a5b4fc">视频</text>
  <text class="ts" x="795" y="94">VisualVAE latent</text>

  <rect class="segText" x="864" y="48" width="130" height="58" rx="8" />
  <text class="lbl" x="929" y="74" fill="#6ee7b7">文本</text>
  <text class="ts" x="929" y="94">指令 / CFG</text>

  <text class="note" x="1010" y="74">…</text>

  <text class="note" x="1010" y="94">一条序列，一次前向</text>

  <line class="flow" x1="600" y1="112" x2="600" y2="142" marker-end="url(#ah2)" />

  <!-- core -->
  <rect class="core" x="60" y="146" width="760" height="132" rx="14" />
  <text class="t" x="440" y="184">Omni Transformer Block × 50（单流共享 backbone）</text>
  <text class="ts" x="440" y="210">hidden 5376 · 56 个注意力头 × 128 维</text>
  <text class="ts" x="440" y="234">视频与音频在同一注意力里互相看见 → 口型、环境音、配乐天然对齐</text>
  <text class="ts" x="440" y="258">总参数 33B（dense，非 MoE）</text>

  <!-- AdaLN side -->
  <rect class="side" x="846" y="146" width="324" height="132" rx="14" />
  <text class="ty" x="1008" y="178">AdaLN 调制分支 ≈ 13B</text>
  <text class="tv" x="1008" y="204" text-anchor="middle">只依赖时间步嵌入，</text>
  <text class="tv" x="1008" y="226" text-anchor="middle">与序列内容无关 → 可预计算并缓存</text>
  <text class="ty" x="1008" y="256" text-anchor="middle">推理常驻 ≈ 20.11B（约 40.3 GB）</text>

  <line class="flow" x1="600" y1="282" x2="600" y2="312" marker-end="url(#ah2)" />

  <!-- VAEs -->
  <rect class="vae" x="60" y="316" width="520" height="96" rx="14" />
  <text class="t" x="320" y="348">H3-VisualVAE</text>
  <text class="ts" x="320" y="372">ViT + CNN 的 KL VAE · 16× 空间压缩 / 4× 时间压缩</text>
  <text class="ts" x="320" y="394">解码回像素级视频帧</text>

  <rect class="vae" x="620" y="316" width="550" height="96" rx="14" />
  <text class="t" x="895" y="348">H3-AudioVAE</text>
  <text class="ts" x="895" y="372">32 kHz 立体声 ↔ 40 Hz token（每声道）</text>
  <text class="ts" x="895" y="394">解码回波形，与画面同步输出</text>

  <text class="note" x="30" y="446">要点：音视频共用一个 Transformer，是「原生同步音频」的代价与来源——省掉了后期对齐，代价是序列变长、注意力开销翻倍。</text>
</svg>
