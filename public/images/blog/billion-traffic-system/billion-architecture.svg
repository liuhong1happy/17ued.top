<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="亿级访问系统分层架构：DNS 与 GSLB 调度流量，CDN 与 WAF 承接边缘流量，负载均衡与网关做接入治理，无状态服务层横向扩展，缓存、消息队列、分库分表数据库和搜索分析集群承担数据访问">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .head { fill: #e2e8f0; font-size: 20px; font-weight: 600; text-anchor: middle; }
      .sub { fill: #94a3b8; font-size: 12.5px; text-anchor: middle; }
      .band { fill: rgba(99,102,241,0.06); stroke: rgba(129,140,248,0.22); stroke-width: 1; }
      .bandTx { fill: #64748b; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .user { fill: rgba(251,191,36,0.16); stroke: rgba(251,191,36,0.55); stroke-width: 1.3; }
      .edge { fill: rgba(56,189,248,0.14); stroke: rgba(56,189,248,0.5); stroke-width: 1.2; }
      .acc { fill: rgba(167,139,250,0.15); stroke: rgba(167,139,250,0.52); stroke-width: 1.2; }
      .svc { fill: rgba(99,102,241,0.17); stroke: rgba(129,140,248,0.55); stroke-width: 1.2; }
      .data { fill: rgba(52,211,153,0.14); stroke: rgba(52,211,153,0.5); stroke-width: 1.2; }
      .mq { fill: rgba(251,191,36,0.14); stroke: rgba(251,191,36,0.5); stroke-width: 1.2; }
      .t { fill: #e2e8f0; font-size: 13.5px; font-weight: 600; text-anchor: middle; }
      .s { fill: #94a3b8; font-size: 11px; text-anchor: middle; }
      .y { fill: #fcd34d; font-size: 11.5px; }
      .g { fill: #6ee7b7; font-size: 11.5px; }
      .p { fill: #c4b5fd; font-size: 11.5px; }
      .note { fill: #94a3b8; font-size: 11.5px; }
      .flow { stroke: #818cf8; stroke-width: 2; fill: none; }
      .flowS { stroke: #38bdf8; stroke-width: 1.8; fill: none; }
      .async { stroke: #f59e0b; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; }
      .obs { stroke: #64748b; stroke-width: 1.3; fill: none; stroke-dasharray: 4 4; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#818cf8" />
    </marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8" />
    </marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b" />
    </marker>
  </defs>

  <text x="600" y="32" class="head">亿级访问系统的分层架构</text>
  <text x="600" y="56" class="sub">静态流量在 CDN 终止，动态流量经网关进入无状态服务，重查询下沉到缓存、搜索与 OLAP</text>

  <!-- user -->
  <rect class="user" x="510" y="76" width="180" height="42" rx="9" />
  <text class="t" x="600" y="102">用户 / 客户端</text>

  <line class="flow" x1="600" y1="118" x2="600" y2="140" marker-end="url(#a)" />

  <!-- band 1 -->
  <rect class="band" x="30" y="142" width="1060" height="66" rx="10" />
  <text class="bandTx" x="65" y="169">接入</text>
  <text class="bandTx" x="65" y="189">调度</text>

  <rect class="edge" x="150" y="154" width="280" height="42" rx="8" />
  <text class="t" x="290" y="180">DNS / GSLB</text>
  <rect class="edge" x="455" y="154" width="250" height="42" rx="8" />
  <text class="t" x="580" y="180">HTTPDNS</text>
  <rect class="edge" x="730" y="154" width="330" height="42" rx="8" />
  <text class="t" x="895" y="180">就近接入 · 多线路 · 故障摘除</text>

  <line class="flow" x1="600" y1="208" x2="600" y2="230" marker-end="url(#a)" />

  <!-- band 2 -->
  <rect class="band" x="30" y="232" width="1060" height="66" rx="10" />
  <text class="bandTx" x="65" y="259">边缘</text>
  <text class="bandTx" x="65" y="279">防护</text>

  <rect class="edge" x="150" y="244" width="280" height="42" rx="8" />
  <text class="t" x="290" y="270">CDN 边缘缓存</text>
  <rect class="edge" x="455" y="244" width="250" height="42" rx="8" />
  <text class="t" x="580" y="270">WAF / DDoS 清洗</text>
  <rect class="edge" x="730" y="244" width="330" height="42" rx="8" />
  <text class="t" x="895" y="270">静态资源直接返回 · 动态加速回源</text>

  <line class="flow" x1="600" y1="298" x2="600" y2="320" marker-end="url(#a)" />

  <!-- band 3 -->
  <rect class="band" x="30" y="322" width="1060" height="66" rx="10" />
  <text class="bandTx" x="65" y="349">接入</text>
  <text class="bandTx" x="65" y="369">治理</text>

  <rect class="acc" x="150" y="334" width="250" height="42" rx="8" />
  <text class="t" x="275" y="360">LVS / Nginx / SLB</text>
  <line class="flowS" x1="400" y1="355" x2="445" y2="355" marker-end="url(#as)" />
  <rect class="acc" x="450" y="334" width="300" height="42" rx="8" />
  <text class="t" x="600" y="360">API 网关：鉴权 · 限流 · 灰度</text>
  <rect class="acc" x="775" y="334" width="285" height="42" rx="8" />
  <text class="t" x="917" y="360">路由 · 熔断 · traceId · 日志</text>

  <line class="flow" x1="600" y1="388" x2="600" y2="410" marker-end="url(#a)" />

  <!-- band 4 services -->
  <rect class="band" x="30" y="412" width="1060" height="96" rx="10" />
  <text class="bandTx" x="65" y="452">无状态</text>
  <text class="bandTx" x="65" y="472">服务层</text>

  <rect class="svc" x="150" y="424" width="180" height="72" rx="8" />
  <text class="t" x="240" y="450">BFF / 聚合</text>
  <text class="s" x="240" y="470">按端裁剪 · 聚合</text>
  <text class="s" x="240" y="486">水平扩展</text>

  <rect class="svc" x="348" y="424" width="180" height="72" rx="8" />
  <text class="t" x="438" y="450">核心服务</text>
  <text class="s" x="438" y="470">订单 · 支付 · 库存</text>
  <text class="s" x="438" y="486">无状态多实例</text>

  <rect class="svc" x="546" y="424" width="180" height="72" rx="8" />
  <text class="t" x="636" y="450">业务服务</text>
  <text class="s" x="636" y="470">用户 · 商品 · 内容</text>
  <text class="s" x="636" y="486">独立扩缩容</text>

  <rect class="svc" x="744" y="424" width="180" height="72" rx="8" />
  <text class="t" x="834" y="450">异步 Worker</text>
  <text class="s" x="834" y="470">消息消费 · 任务</text>
  <text class="s" x="834" y="486">按堆积扩容</text>

  <rect class="svc" x="942" y="424" width="118" height="72" rx="8" />
  <text class="t" x="1001" y="450">定时任务</text>
  <text class="s" x="1001" y="470">分布式调度</text>
  <text class="s" x="1001" y="486">防重复执行</text>

  <!-- service to data arrows -->
  <line class="flowS" x1="240" y1="508" x2="240" y2="540" marker-end="url(#as)" />
  <line class="flowS" x1="438" y1="508" x2="438" y2="540" marker-end="url(#as)" />
  <line class="flowS" x1="636" y1="508" x2="636" y2="540" marker-end="url(#as)" />

  <!-- band 5 data -->
  <rect class="band" x="30" y="542" width="1060" height="90" rx="10" />
  <text class="bandTx" x="65" y="582">数据与</text>
  <text class="bandTx" x="65" y="602">异步</text>

  <rect class="data" x="150" y="554" width="150" height="66" rx="8" />
  <text class="t" x="225" y="578">本地缓存</text>
  <text class="s" x="225" y="596">Caffeine · 本地 LRU</text>
  <text class="s" x="225" y="611">极热 · 可重建</text>

  <rect class="data" x="316" y="554" width="160" height="66" rx="8" />
  <text class="t" x="396" y="578">Redis Cluster</text>
  <text class="s" x="396" y="596">会话 · 对象 · 计数</text>
  <text class="s" x="396" y="611">分片 · 多副本</text>

  <rect class="mq" x="492" y="554" width="150" height="66" rx="8" />
  <text class="t" x="567" y="578">消息队列</text>
  <text class="s" x="567" y="596">解耦 · 异步 · 削峰</text>
  <text class="s" x="567" y="611">幂等 · 死信</text>

  <rect class="data" x="658" y="554" width="190" height="66" rx="8" />
  <text class="t" x="753" y="578">数据库</text>
  <text class="s" x="753" y="596">读写分离 · 分库分表</text>
  <text class="s" x="753" y="611">索引 · 归档 · 事务</text>

  <rect class="data" x="864" y="554" width="196" height="66" rx="8" />
  <text class="t" x="962" y="578">搜索 / OLAP / OSS</text>
  <text class="s" x="962" y="596">ES · ClickHouse · Doris</text>
  <text class="s" x="962" y="611">检索 · 报表 · 文件</text>

  <!-- async arrow to MQ from core service -->
  <path class="async" d="M438 508 L438 528 L567 528 L567 550" marker-end="url(#ay)" />
  <text class="y" x="454" y="516">异步落库 / 通知</text>

  <!-- bottom principles -->
  <rect class="band" x="30" y="654" width="1060" height="74" rx="10" />
  <text class="bandTx" x="65" y="684">可观测</text>
  <text class="bandTx" x="65" y="704">与治理</text>
  <text class="p" x="150" y="682">Metrics + Logs + Traces + traceId</text>
  <text class="note" x="150" y="704">QPS · P99 · 错误率 · 缓存命中率 · 慢查询 · MQ 堆积 · 复制延迟</text>
  <text class="note" x="700" y="704">SLO / 错误预算 · 告警分级 · 限流熔断 · 降级演练 · 容量压测</text>

  <!-- side note -->
  <rect class="band" x="30" y="750" width="1060" height="48" rx="10" />
  <text class="note" x="60" y="772">每一层都要能独立扩展、独立降级；任何不能水平扩展的组件，都是系统的天花板。</text>
  <text class="note" x="60" y="790">静态流量用 CDN 挡掉，动态流量用缓存和异步削掉，只有必要请求才允许到达数据库。</text>
</svg>
