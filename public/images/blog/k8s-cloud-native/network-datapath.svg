<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-label="kube-proxy iptables 模式与 Cilium eBPF 模式的数据路径对比">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .panel { fill: rgba(255,255,255,0.04); stroke: rgba(255,255,255,0.14); stroke-width: 1.2; }
      .panelTitle { font-size: 17px; font-weight: 600; text-anchor: middle; }
      .slowStep { fill: rgba(251,113,133,0.14); stroke: rgba(251,113,133,0.45); stroke-width: 1.1; }
      .fastStep { fill: rgba(99,102,241,0.16); stroke: rgba(129,140,248,0.5); stroke-width: 1.1; }
      .stepTitle { fill: #e2e8f0; font-size: 14.5px; text-anchor: middle; }
      .stepSub { fill: #94a3b8; font-size: 12px; text-anchor: middle; }
      .slowArrow { stroke: #fb7185; stroke-width: 2; }
      .fastArrow { stroke: #818cf8; stroke-width: 2; }
      .badge { font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .cmp { fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.14); stroke-width: 1.1; }
      .cmpText { fill: #cbd5e1; font-size: 13px; text-anchor: middle; }
    </style>
    <marker id="slow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fb7185" />
    </marker>
    <marker id="fast" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#818cf8" />
    </marker>
  </defs>

  <!-- 左：iptables -->
  <rect class="panel" x="50" y="46" width="520" height="404" rx="16" />
  <text class="panelTitle" x="310" y="82" fill="#fda4af">iptables 模式（kube-proxy 默认）</text>

  <rect class="slowStep" x="110" y="106" width="400" height="58" rx="11" />
  <text class="stepTitle" x="310" y="131">应用发起连接（socket）</text>
  <text class="stepSub" x="310" y="151">ClusterIP 10.96.0.10:443</text>

  <line class="slowArrow" x1="310" y1="168" x2="310" y2="178" marker-end="url(#slow)" />

  <rect class="slowStep" x="110" y="182" width="400" height="58" rx="11" />
  <text class="stepTitle" x="310" y="207">iptables 规则链线性匹配</text>
  <text class="stepSub" x="310" y="227">KUBE-SERVICES → KUBE-SVC-* → KUBE-SEP-*</text>

  <line class="slowArrow" x1="310" y1="244" x2="310" y2="254" marker-end="url(#slow)" />

  <rect class="slowStep" x="110" y="258" width="400" height="58" rx="11" />
  <text class="stepTitle" x="310" y="283">conntrack 查表 / DNAT</text>
  <text class="stepSub" x="310" y="303">连接跟踪表打满会随机丢包</text>

  <line class="slowArrow" x1="310" y1="320" x2="310" y2="330" marker-end="url(#slow)" />

  <rect class="slowStep" x="110" y="334" width="400" height="58" rx="11" />
  <text class="stepTitle" x="310" y="359">转发到目标 Pod</text>
  <text class="stepSub" x="310" y="379">每跳都要经过 netfilter</text>

  <text class="badge" x="310" y="424" fill="#fda4af">查找复杂度 O(n) — Service 越多越慢</text>

  <!-- 右：eBPF -->
  <rect class="panel" x="630" y="46" width="520" height="404" rx="16" />
  <text class="panelTitle" x="890" y="82" fill="#c7d2fe">eBPF 模式（Cilium 替代 kube-proxy）</text>

  <rect class="fastStep" x="690" y="106" width="400" height="58" rx="11" />
  <text class="stepTitle" x="890" y="131">应用发起连接（socket）</text>
  <text class="stepSub" x="890" y="151">ClusterIP 10.96.0.10:443</text>

  <line class="fastArrow" x1="890" y1="168" x2="890" y2="178" marker-end="url(#fast)" />

  <rect class="fastStep" x="690" y="182" width="400" height="58" rx="11" />
  <text class="stepTitle" x="890" y="207">eBPF socket 层短路</text>
  <text class="stepSub" x="890" y="227">connect() 直接改写为后端 Pod 地址</text>

  <line class="fastArrow" x1="890" y1="244" x2="890" y2="254" marker-end="url(#fast)" />

  <rect class="fastStep" x="690" y="258" width="400" height="58" rx="11" />
  <text class="stepTitle" x="890" y="283">转发到目标 Pod</text>
  <text class="stepSub" x="890" y="303">跳过冗长的规则链遍历</text>

  <line class="fastArrow" x1="890" y1="320" x2="890" y2="330" marker-end="url(#fast)" />

  <rect class="fastStep" x="690" y="334" width="400" height="58" rx="11" />
  <text class="stepTitle" x="890" y="359">内核态可观测</text>
  <text class="stepSub" x="890" y="379">策略命中、丢包、调用链，无需抓包</text>

  <text class="badge" x="890" y="424" fill="#c7d2fe">查找复杂度 O(1) — 哈希表 + 策略即时生效</text>

  <!-- 底部结论 -->
  <rect class="cmp" x="50" y="478" width="520" height="64" rx="13" />
  <text class="cmpText" x="310" y="504">规则随 Service 数量线性增长</text>
  <text class="cmpText" x="310" y="526">上千 Service 后规则更新延迟明显上升</text>

  <rect class="cmp" x="630" y="478" width="520" height="64" rx="13" />
  <text class="cmpText" x="890" y="504">数据包少走一层 netfilter</text>
  <text class="cmpText" x="890" y="526">跨节点转发与策略检查都在内核态完成</text>
</svg>
