<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="JIT 与 AOT 执行模型对比：JIT 在运行时惰性编译、收集类型反馈、优化热点并可能反优化；AOT 在构建时做全程序分析和 Tree Shaking，直接生成机器码，启动即执行">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .head { fill: #e2e8f0; font-size: 20px; font-weight: 600; text-anchor: middle; }
      .sub { fill: #94a3b8; font-size: 12.5px; text-anchor: middle; }
      .panelJ { fill: rgba(99,102,241,0.06); stroke: rgba(129,140,248,0.28); stroke-width: 1.1; }
      .panelA { fill: rgba(52,211,153,0.06); stroke: rgba(52,211,153,0.28); stroke-width: 1.1; }
      .jbox { fill: rgba(99,102,241,0.16); stroke: rgba(129,140,248,0.55); stroke-width: 1.2; }
      .abox { fill: rgba(52,211,153,0.14); stroke: rgba(52,211,153,0.5); stroke-width: 1.2; }
      .opt { fill: rgba(251,191,36,0.14); stroke: rgba(251,191,36,0.5); stroke-width: 1.2; }
      .t { fill: #e2e8f0; font-size: 13.5px; font-weight: 600; text-anchor: middle; }
      .s { fill: #94a3b8; font-size: 11px; text-anchor: middle; }
      .p { fill: #c4b5fd; font-size: 12px; }
      .g { fill: #6ee7b7; font-size: 12px; }
      .y { fill: #fcd34d; font-size: 11.5px; }
      .note { fill: #94a3b8; font-size: 11.5px; }
      .flowJ { stroke: #818cf8; stroke-width: 2; fill: none; }
      .flowA { stroke: #34d399; stroke-width: 2; fill: none; }
      .deopt { stroke: #f59e0b; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; }
      .box { fill: rgba(255,255,255,0.04); stroke: rgba(255,255,255,0.13); stroke-width: 1; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#818cf8" />
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399" />
    </marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b" />
    </marker>
  </defs>

  <text x="600" y="32" class="head">JIT 与 AOT 的执行模型</text>
  <text x="600" y="56" class="sub">同样的 Dart 代码，一个在运行时编译，一个在构建时编译</text>

  <!-- JIT panel -->
  <rect class="panelJ" x="40" y="80" width="540" height="470" rx="12" />
  <text class="t" x="310" y="108">JIT（Debug）</text>
  <text class="p" x="62" y="132">运行时编译 · 惰性 · 类型反馈 · 可反优化</text>

  <rect class="jbox" x="120" y="152" width="380" height="48" rx="8" />
  <text class="t" x="310" y="173">加载 Kernel</text>
  <text class="s" x="310" y="191">设备上的 Dart VM</text>

  <line class="flowJ" x1="310" y1="200" x2="310" y2="220" marker-end="url(#a)" />

  <rect class="jbox" x="120" y="224" width="380" height="48" rx="8" />
  <text class="t" x="310" y="245">先执行未优化代码</text>
  <text class="s" x="310" y="263">快速可用，启动有预热</text>

  <line class="flowJ" x1="310" y1="272" x2="310" y2="292" marker-end="url(#a)" />

  <rect class="opt" x="120" y="296" width="380" height="48" rx="8" />
  <text class="t" x="310" y="317">收集类型反馈</text>
  <text class="s" x="310" y="335">参数类型 · 调用目标 · 分支走向</text>

  <line class="flowJ" x1="310" y1="344" x2="310" y2="364" marker-end="url(#a)" />

  <rect class="jbox" x="120" y="368" width="380" height="48" rx="8" />
  <text class="t" x="310" y="389">热点函数优化编译</text>
  <text class="s" x="310" y="407">内联 · 特化 · 去虚化</text>

  <line class="flowJ" x1="310" y1="416" x2="310" y2="436" marker-end="url(#a)" />

  <rect class="jbox" x="120" y="440" width="380" height="48" rx="8" />
  <text class="t" x="310" y="461">高质量机器码 + 代码缓存</text>
  <text class="s" x="310" y="479">热点代码跑得快，但占内存</text>

  <path class="deopt" d="M120 464 C 70 464, 70 248, 116 248" marker-end="url(#ay)" />
  <text class="y" x="48" y="356" transform="rotate(-90 48 356)">反优化</text>
  <text class="note" x="62" y="516">假设被打破（类型变了）→ 退回未优化代码，重新收集反馈。</text>
  <text class="note" x="62" y="536">Hot Reload 依赖 Kernel + JIT 的可替换性。</text>

  <!-- AOT panel -->
  <rect class="panelA" x="620" y="80" width="540" height="470" rx="12" />
  <text class="t" x="890" y="108">AOT（Profile / Release）</text>
  <text class="g" x="642" y="132">构建时编译 · 全程序 · 无运行时编译器</text>

  <rect class="abox" x="700" y="152" width="380" height="48" rx="8" />
  <text class="t" x="890" y="173">全程序分析</text>
  <text class="s" x="890" y="191">从入口出发，确定所有可达代码</text>

  <line class="flowA" x1="890" y1="200" x2="890" y2="220" marker-end="url(#ag)" />

  <rect class="abox" x="700" y="224" width="380" height="48" rx="8" />
  <text class="t" x="890" y="245">Tree Shaking</text>
  <text class="s" x="890" y="263">删除不可达类 / 函数 / 字段</text>

  <line class="flowA" x1="890" y1="272" x2="890" y2="292" marker-end="url(#ag)" />

  <rect class="abox" x="700" y="296" width="380" height="48" rx="8" />
  <text class="t" x="890" y="317">gen_snapshot</text>
  <text class="s" x="890" y="335">按目标架构生成机器码</text>

  <line class="flowA" x1="890" y1="344" x2="890" y2="364" marker-end="url(#ag)" />

  <rect class="abox" x="700" y="368" width="380" height="48" rx="8" />
  <text class="t" x="890" y="389">libapp.so / App.framework</text>
  <text class="s" x="890" y="407">AOT snapshot，随包发布</text>

  <line class="flowA" x1="890" y1="416" x2="890" y2="436" marker-end="url(#ag)" />

  <rect class="abox" x="700" y="440" width="380" height="48" rx="8" />
  <text class="t" x="890" y="461">预编译运行时直接执行</text>
  <text class="s" x="890" y="479">无 JIT 预热 · 启动即峰值</text>

  <text class="note" x="642" y="516">没有运行时编译，也没有反优化抖动；代码在构建时已固化。</text>
  <text class="note" x="642" y="536">不能 Hot Reload；动态调用/反射入口需要 @pragma('vm:entry-point')。</text>

  <!-- bottom -->
  <rect class="box" x="40" y="574" width="1120" height="66" rx="10" />
  <text class="note" x="62" y="598">JIT 用「运行时信息」换「启动预热和内存」；AOT 用「构建时间和动态能力」换「启动速度、稳定性和 iOS 合规」。</text>
  <text class="note" x="62" y="620">Flutter 生产选 AOT，不是因为 JIT 一定慢，而是因为可预测性、启动、内存和上架要求更重要。</text>
</svg>
