<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="百万数据查询优化路径：慢查询经过执行计划诊断扫描行数、回表、排序和临时表，按 SQL、索引、表结构、架构的成本顺序逐层优化">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .head { fill: #e2e8f0; font-size: 20px; font-weight: 600; text-anchor: middle; }
      .sub { fill: #94a3b8; font-size: 12.5px; text-anchor: middle; }
      .section { fill: #c7d2fe; font-size: 14px; font-weight: 600; }
      .box { fill: rgba(99,102,241,0.15); stroke: rgba(129,140,248,0.5); stroke-width: 1.2; }
      .boxB { fill: rgba(56,189,248,0.14); stroke: rgba(56,189,248,0.5); stroke-width: 1.2; }
      .boxG { fill: rgba(52,211,153,0.14); stroke: rgba(52,211,153,0.5); stroke-width: 1.2; }
      .boxY { fill: rgba(251,191,36,0.14); stroke: rgba(251,191,36,0.5); stroke-width: 1.2; }
      .boxR { fill: rgba(248,113,113,0.13); stroke: rgba(248,113,113,0.45); stroke-width: 1.2; }
      .boxN { fill: rgba(255,255,255,0.04); stroke: rgba(255,255,255,0.13); stroke-width: 1; }
      .t { fill: #e2e8f0; font-size: 13.5px; font-weight: 600; text-anchor: middle; }
      .s { fill: #94a3b8; font-size: 11.5px; text-anchor: middle; }
      .k { fill: #c7d2fe; font-size: 12px; }
      .g { fill: #6ee7b7; font-size: 12px; }
      .y { fill: #fcd34d; font-size: 12px; }
      .r { fill: #fca5a5; font-size: 12px; }
      .note { fill: #94a3b8; font-size: 12px; }
      .flow { stroke: #818cf8; stroke-width: 2; fill: none; }
      .flowG { stroke: #34d399; stroke-width: 2; fill: none; }
      .ladder { stroke: #64748b; stroke-width: 1.4; fill: none; stroke-dasharray: 6 5; }
      .lbl { fill: #a5b4fc; font-size: 11.5px; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#818cf8" />
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399" />
    </marker>
  </defs>

  <text x="600" y="32" class="head">百万数据查询：先诊断，再优化</text>
  <text x="600" y="56" class="sub">优化的目标不是「走索引」，而是「少读页、少回表、少排序」</text>

  <!-- diagnosis pipeline -->
  <text x="40" y="94" class="section">① 诊断链路</text>

  <rect class="box" x="40" y="110" width="190" height="62" rx="9" />
  <text class="t" x="135" y="134">慢查询日志</text>
  <text class="s" x="135" y="153">performance_schema</text>

  <line class="flow" x1="230" y1="141" x2="276" y2="141" marker-end="url(#a)" />

  <rect class="boxB" x="280" y="110" width="200" height="62" rx="9" />
  <text class="t" x="380" y="134">EXPLAIN ANALYZE</text>
  <text class="s" x="380" y="153">估算 vs 实际</text>

  <line class="flow" x1="480" y1="141" x2="526" y2="141" marker-end="url(#a)" />

  <rect class="boxY" x="530" y="110" width="220" height="62" rx="9" />
  <text class="t" x="640" y="134">看三个数字</text>
  <text class="s" x="640" y="153">扫描行 · 回表 · 排序/临时表</text>

  <line class="flow" x1="750" y1="141" x2="796" y2="141" marker-end="url(#a)" />

  <rect class="boxG" x="800" y="110" width="200" height="62" rx="9" />
  <text class="t" x="900" y="134">定位根因</text>
  <text class="s" x="900" y="153">进入对应的优化分支</text>

  <text class="note" x="1030" y="134">先确认统计信息</text>
  <text class="note" x="1030" y="154">是否准确</text>

  <!-- four branches -->
  <text x="40" y="220" class="section">② 四类根因与首选手段</text>

  <rect class="boxR" x="40" y="238" width="270" height="100" rx="9" />
  <text class="t" x="175" y="264">扫描行数 &gt;&gt; 返回行数</text>
  <text class="r" x="175" y="288">索引缺失 / 失效 / 选择性差</text>
  <text class="s" x="175" y="312">→ 补索引、改写条件、联合索引</text>

  <rect class="boxY" x="325" y="238" width="270" height="100" rx="9" />
  <text class="t" x="460" y="264">回表次数太多</text>
  <text class="r" x="460" y="288">二级索引查到主键后随机 I/O</text>
  <text class="s" x="460" y="312">→ 覆盖索引、只查索引列</text>

  <rect class="boxY" x="610" y="238" width="270" height="100" rx="9" />
  <text class="t" x="745" y="264">filesort / temporary</text>
  <text class="r" x="745" y="288">排序、分组、去重无法利用索引</text>
  <text class="s" x="745" y="312">→ 调整索引顺序、预聚合</text>

  <rect class="boxB" x="895" y="238" width="265" height="100" rx="9" />
  <text class="t" x="1027" y="264">返回行数本身太大</text>
  <text class="r" x="1027" y="288">一次取全量、深分页、导出</text>
  <text class="s" x="1027" y="312">→ 游标分页、异步导出、流式读</text>

  <!-- cost ladder -->
  <text x="40" y="392" class="section">③ 按成本从低到高优化，不要跳级</text>

  <rect class="boxG" x="40" y="410" width="250" height="76" rx="9" />
  <text class="t" x="165" y="436">SQL 改写</text>
  <text class="g" x="165" y="458">成本：低</text>
  <text class="s" x="165" y="476">去 SELECT *、去函数、分页、批量</text>

  <line class="flow" x1="290" y1="448" x2="326" y2="448" marker-end="url(#a)" />

  <rect class="boxG" x="330" y="410" width="250" height="76" rx="9" />
  <text class="t" x="455" y="436">索引优化</text>
  <text class="g" x="455" y="458">成本：低–中</text>
  <text class="s" x="455" y="476">联合索引、覆盖索引、清冗余</text>

  <line class="flow" x1="580" y1="448" x2="616" y2="448" marker-end="url(#a)" />

  <rect class="boxY" x="620" y="410" width="250" height="76" rx="9" />
  <text class="t" x="745" y="436">表与数据</text>
  <text class="y" x="745" y="458">成本：中–高</text>
  <text class="s" x="745" y="476">归档、分区、冷热分离、拆分</text>

  <line class="flow" x1="870" y1="448" x2="906" y2="448" marker-end="url(#a)" />

  <rect class="boxR" x="910" y="410" width="250" height="76" rx="9" />
  <text class="t" x="1035" y="436">架构</text>
  <text class="r" x="1035" y="458">成本：高</text>
  <text class="s" x="1035" y="476">缓存、读写分离、ES、OLAP、分表</text>

  <!-- bottom principles -->
  <rect class="boxN" x="40" y="520" width="1120" height="188" rx="12" />
  <text class="section" x="62" y="546">三个判断标准</text>

  <text class="k" x="62" y="574">1. 扫描行数是否接近返回行数？</text>
  <text class="note" x="62" y="596">如果扫了 100 万行只返回 20 行，先解决索引和条件，而不是加缓存。</text>

  <text class="k" x="62" y="624">2. 是否必须回表？</text>
  <text class="note" x="62" y="646">列表页只查索引列；详情按 id 批量查；覆盖索引能消掉大量随机 I/O。</text>

  <text class="k" x="62" y="674">3. 这些数据是否本来就不该放在一张热表里？</text>
  <text class="note" x="62" y="696">历史数据归档、按时间分区、冷热分离，往往比任何 SQL 技巧都有效。</text>
</svg>
