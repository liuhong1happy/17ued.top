<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-label="ReAct 循环：思考、行动、观察三步循环迭代，信息足够时生成最终答案">
  <defs>
    <marker id="r-slate" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#475569"/>
    </marker>
    <marker id="r-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#f59e0b"/>
    </marker>
    <marker id="r-emerald" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="760" height="480" fill="#0f172a"/>
  <text x="24" y="32" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#94a3b8">ReAct 循环与终止条件</text>

  <!-- 思考 -->
  <rect x="120" y="64" width="250" height="64" rx="10" fill="#1b2240" stroke="#4f46e5" stroke-opacity="0.55"/>
  <text x="245" y="92" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#e6ebf5">思考 Thought</text>
  <text x="245" y="113" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#93a3bd">分析目标，判断信息是否足够</text>
  <line x1="245" y1="128" x2="245" y2="154" stroke="#475569" stroke-width="1.5" marker-end="url(#r-slate)"/>

  <!-- 行动 -->
  <rect x="120" y="158" width="250" height="64" rx="10" fill="#151d33" stroke="#2b3a55"/>
  <text x="245" y="186" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#dbe3f0">行动 Action</text>
  <text x="245" y="207" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8b9bb4">生成工具调用指令</text>
  <line x1="245" y1="222" x2="245" y2="248" stroke="#475569" stroke-width="1.5" marker-end="url(#r-slate)"/>

  <!-- 观察 -->
  <rect x="120" y="252" width="250" height="64" rx="10" fill="#151d33" stroke="#2b3a55"/>
  <text x="245" y="280" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#dbe3f0">观察 Observation</text>
  <text x="245" y="301" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8b9bb4">接收工具返回结果</text>

  <!-- 迭代回边 -->
  <path d="M120 284 H74 V96 H116" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#r-amber)"/>
  <text x="56" y="190" transform="rotate(-90 56 190)" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#fbbf24">信息不足，继续迭代</text>

  <!-- 出口 -->
  <line x1="370" y1="284" x2="466" y2="284" stroke="#34d399" stroke-width="1.5" marker-end="url(#r-emerald)"/>
  <text x="418" y="272" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#6ee7b7">信息足够</text>
  <rect x="470" y="252" width="210" height="64" rx="10" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.45"/>
  <text x="575" y="280" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#6ee7b7">生成最终答案</text>
  <text x="575" y="301" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#86d9b6">写入记忆后返回用户</text>

  <!-- 终止条件 -->
  <rect x="74" y="380" width="606" height="68" rx="10" fill="#94a3b8" fill-opacity="0.07" stroke="#2b3a55"/>
  <text x="98" y="410" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">终止条件：信息足够 · 目标已完成 · 达到最大迭代轮次</text>
  <text x="98" y="432" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#8b9bb4">迭代上限是兜底手段，避免任务永远停在「再试一次」里</text>
</svg>
