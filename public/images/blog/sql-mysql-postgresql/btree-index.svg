<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="B+ 树索引结构与回表过程：非叶节点只存键，叶子节点存数据并连成有序链表；二级索引查到主键后需回表再查一次聚簇索引">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .root { fill: rgba(167,139,250,0.20); stroke: rgba(167,139,250,0.6); stroke-width: 1.3; }
      .mid { fill: rgba(99,102,241,0.16); stroke: rgba(129,140,248,0.5); stroke-width: 1.2; }
      .leaf { fill: rgba(56,189,248,0.14); stroke: rgba(56,189,248,0.5); stroke-width: 1.2; }
      .leafRow { fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.16); stroke-width: 1; }
      .title { fill: #e2e8f0; font-size: 15px; font-weight: 600; text-anchor: middle; }
      .key { fill: #c7d2fe; font-size: 13px; text-anchor: middle; }
      .sub { fill: #94a3b8; font-size: 12.5px; text-anchor: middle; }
      .sectionHead { fill: #c7d2fe; font-size: 16px; font-weight: 600; }
      .note { fill: #94a3b8; font-size: 12.5px; }
      .flow { stroke: #818cf8; stroke-width: 2; fill: none; }
      .link { stroke: #38bdf8; stroke-width: 2; fill: none; }
      .step { fill: rgba(99,102,241,0.14); stroke: rgba(129,140,248,0.5); stroke-width: 1.2; }
      .stepTitle { fill: #e2e8f0; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .stepSub { fill: #94a3b8; font-size: 12px; text-anchor: middle; }
      .stepNote { fill: #a5b4fc; font-size: 12px; text-anchor: middle; }
      .cover { fill: rgba(52,211,153,0.14); stroke: rgba(52,211,153,0.5); stroke-width: 1.2; }
      .coverText { fill: #6ee7b7; font-size: 12.5px; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#818cf8" />
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8" />
    </marker>
  </defs>

  <text x="40" y="36" class="sectionHead">B+ 树：矮胖、有序、叶子成链</text>
  <text x="40" y="58" class="note">非叶节点只存键和指针，一行数据只在叶子出现一次 —— 这让单页能装下更多键，树更矮，I/O 更少。</text>

  <!-- root -->
  <rect class="root" x="490" y="78" width="220" height="46" rx="10" />
  <text class="title" x="600" y="107">根节点（常驻内存）</text>

  <!-- mids -->
  <rect class="mid" x="200" y="172" width="200" height="46" rx="10" />
  <text class="title" x="300" y="201">键 1..500</text>
  <rect class="mid" x="700" y="172" width="200" height="46" rx="10" />
  <text class="title" x="800" y="201">键 501..1000</text>

  <path class="flow" d="M560,124 L330,172" marker-end="url(#ah)" />
  <path class="flow" d="M640,124 L770,172" marker-end="url(#ah)" />

  <!-- leaves -->
  <rect class="leaf" x="60" y="270" width="240" height="76" rx="10" />
  <text class="key" x="180" y="298">120 | 240 | 360</text>
  <text class="sub" x="180" y="330">叶子：整行数据</text>

  <rect class="leaf" x="360" y="270" width="240" height="76" rx="10" />
  <text class="key" x="480" y="298">480 | 500 | 501</text>
  <text class="sub" x="480" y="330">叶子：整行数据</text>

  <rect class="leaf" x="660" y="270" width="240" height="76" rx="10" />
  <text class="key" x="780" y="298">620 | 740 | 860</text>
  <text class="sub" x="780" y="330">叶子：整行数据</text>

  <rect class="leaf" x="960" y="270" width="180" height="76" rx="10" />
  <text class="key" x="1050" y="298">940 | 1000</text>
  <text class="sub" x="1050" y="330">叶子</text>

  <path class="flow" d="M270,218 L190,270" marker-end="url(#ah)" />
  <path class="flow" d="M330,218 L470,270" marker-end="url(#ah)" />
  <path class="flow" d="M770,218 L790,270" marker-end="url(#ah)" />
  <path class="flow" d="M830,218 L1040,270" marker-end="url(#ah)" />

  <!-- leaf linked list -->
  <path class="link" d="M300,346 L360,346" marker-end="url(#ahb)" />
  <path class="link" d="M600,346 L660,346" marker-end="url(#ahb)" />
  <path class="link" d="M900,346 L960,346" marker-end="url(#ahb)" />
  <text class="sub" x="450" y="368" style="fill:#7dd3fc">叶子之间用双向指针连成有序链表 → 范围查询顺着链表扫即可</text>

  <line x1="40" y1="398" x2="1160" y2="398" stroke="rgba(255,255,255,0.10)" stroke-width="1" />

  <text x="40" y="430" class="sectionHead">一次二级索引查询，要爬两棵树</text>

  <!-- steps -->
  <rect class="step" x="50" y="456" width="330" height="126" rx="12" />
  <text class="stepTitle" x="215" y="484">① 查二级索引</text>
  <text class="stepSub" x="215" y="510">索引列 = 'Alice'</text>
  <text class="stepSub" x="215" y="532">叶子节点存的是「索引列 + 主键值」</text>
  <text class="stepNote" x="215" y="560">拿到主键 id = 1007</text>

  <path class="flow" d="M390,519 L450,519" marker-end="url(#ah)" />

  <rect class="step" x="460" y="456" width="330" height="126" rx="12" />
  <text class="stepTitle" x="625" y="484">② 回表</text>
  <text class="stepSub" x="625" y="510">用 id = 1007 再查一次聚簇索引</text>
  <text class="stepSub" x="625" y="532">聚簇索引的叶子才是整行数据</text>
  <text class="stepNote" x="625" y="560">这一步是额外的一到多次 I/O</text>

  <path class="flow" d="M800,519 L860,519" marker-end="url(#ah)" />

  <rect class="step" x="870" y="456" width="280" height="126" rx="12" />
  <text class="stepTitle" x="1010" y="484">③ 返回结果</text>
  <text class="stepSub" x="1010" y="510">取出 name / email / 其他列</text>
  <text class="stepSub" x="1010" y="532">回表次数多 → 优化器可能</text>
  <text class="stepSub" x="1010" y="550">干脆放弃索引走全表</text>

  <rect class="cover" x="50" y="600" width="1100" height="60" rx="12" />
  <text class="coverText" x="600" y="626" style="text-anchor:middle;font-weight:600">覆盖索引：如果 SELECT 的列全在索引里，第 ② 步可以完全跳过</text>
  <text class="coverText" x="600" y="648" style="text-anchor:middle">EXPLAIN 的 Extra 列出现「Using index」就是这个信号 —— 这是最值得争取的优化之一</text>
</svg>
