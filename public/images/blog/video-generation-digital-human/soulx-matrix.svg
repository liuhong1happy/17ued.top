<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-label="SoulX 数字人三件套对比：14B 的 FlashTalk 主打质量与低首帧延迟，LiveAct 用 Neighbor Forcing 与 ConvKV Memory 做到双卡小时级生成，1.3B 的 FlashHead 面向单卡消费级 GPU 高吞吐">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .c1 { fill: rgba(99,102,241,0.10); stroke: rgba(129,140,248,0.5); stroke-width: 1.3; }
      .c2 { fill: rgba(167,139,250,0.10); stroke: rgba(167,139,250,0.5); stroke-width: 1.3; }
      .c3 { fill: rgba(52,211,153,0.10); stroke: rgba(52,211,153,0.45); stroke-width: 1.3; }
      .tag { fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.13); stroke-width: 1; }
      .h { fill: #e2e8f0; font-size: 17px; font-weight: 600; }
      .k { fill: #c7d2fe; font-size: 12.5px; font-weight: 600; }
      .kp { fill: #c4b5fd; font-size: 12.5px; font-weight: 600; }
      .kg { fill: #6ee7b7; font-size: 12.5px; font-weight: 600; }
      .s { fill: #94a3b8; font-size: 12.5px; }
      .v { fill: #cbd5e1; font-size: 12.5px; }
      .m { fill: #e2e8f0; font-size: 12.5px; font-weight: 600; }
      .tagT { fill: #a5b4fc; font-size: 11px; text-anchor: middle; }
      .note { fill: #94a3b8; font-size: 12.5px; }
    </style>
  </defs>

  <!-- Card 1 -->
  <rect class="c1" x="30" y="24" width="370" height="470" rx="16" />
  <text class="k" x="56" y="58">质量优先 · 14B</text>
  <text class="h" x="56" y="88">SoulX-FlashTalk</text>
  <text class="s" x="56" y="114">首个做到亚秒级启动的 14B 数字人模型</text>
  <line x1="56" y1="130" x2="374" y2="130" stroke="rgba(255,255,255,0.12)" />
  <text class="k" x="56" y="156">实测指标</text>
  <text class="v" x="56" y="180">0.87s 首帧延迟 · 32 FPS · 8×H800</text>
  <text class="v" x="56" y="202">小时级连续生成不崩、不漂移</text>
  <text class="k" x="56" y="232">核心方法</text>
  <text class="v" x="56" y="256">· 自校正双向蒸馏</text>
  <text class="s" x="72" y="276">块内保留双向注意力，不牺牲时空连贯</text>
  <text class="v" x="56" y="300">· 多步回溯自校正</text>
  <text class="s" x="72" y="320">回看已生成的片段，主动修正累积误差</text>
  <text class="v" x="56" y="344">· 两阶段训练，约 1.2k 步收敛</text>
  <text class="k" x="56" y="374">评测（TalkBench）</text>
  <text class="v" x="56" y="398">ASE 3.51 · IQA 4.79 · Sync-C 1.47</text>
  <text class="v" x="56" y="420">身份一致性 Subject-C 99.22</text>
  <rect class="tag" x="56" y="440" width="150" height="30" rx="9" />
  <text class="tagT" x="131" y="459">24 小时 AI 直播</text>
  <rect class="tag" x="216" y="440" width="150" height="30" rx="9" />
  <text class="tagT" x="291" y="459">虚拟主播</text>

  <!-- Card 2 -->
  <rect class="c2" x="415" y="24" width="370" height="470" rx="16" />
  <text class="kp" x="441" y="58">小时级 · 高鲁棒</text>
  <text class="h" x="441" y="88">SoulX-LiveAct</text>
  <text class="s" x="441" y="114">自 Wan2.1 与 InfiniteTalk 初始化</text>
  <line x1="441" y1="130" x2="759" y2="130" stroke="rgba(255,255,255,0.12)" />
  <text class="kp" x="441" y="156">实测指标</text>
  <text class="v" x="441" y="180">2×H100/H200 上 20 FPS</text>
  <text class="v" x="441" y="202">约 0.94s 延迟 · 恒定显存 · 小时级时长</text>
  <text class="kp" x="441" y="232">核心方法</text>
  <text class="v" x="441" y="256">· Neighbor Forcing</text>
  <text class="s" x="457" y="276">把时间相邻帧在同一噪声条件下作为 latent</text>
  <text class="s" x="457" y="294">邻居传播，给出分布对齐的稳定学习信号</text>
  <text class="s" x="457" y="314">仅需 300 蒸馏步（Self Forcing 要 1000）</text>
  <text class="v" x="441" y="338">· ConvKV Memory</text>
  <text class="s" x="457" y="358">一维卷积把因果注意力的 K/V 压成定长记忆</text>
  <text class="s" x="457" y="378">压缩比 λ=5，配 RoPE 重置，仅 +1.9% 开销</text>
  <text class="kp" x="441" y="404">算力画像</text>
  <text class="v" x="441" y="428">27.2 TFLOPs/帧（双向注意力约 50.2）</text>
  <rect class="tag" x="441" y="440" width="150" height="30" rx="9" />
  <text class="tagT" x="516" y="459">长时互动</text>
  <rect class="tag" x="601" y="440" width="150" height="30" rx="9" />
  <text class="tagT" x="676" y="459">全身动作 + 情绪编辑</text>

  <!-- Card 3 -->
  <rect class="c3" x="800" y="24" width="370" height="470" rx="16" />
  <text class="kg" x="826" y="58">轻量 · 1.3B</text>
  <text class="h" x="826" y="88">SoulX-FlashHead</text>
  <text class="s" x="826" y="114">把数字人塞进消费级显卡</text>
  <line x1="826" y1="130" x2="1144" y2="130" stroke="rgba(255,255,255,0.12)" />
  <text class="kg" x="826" y="156">实测指标</text>
  <text class="v" x="826" y="180">Lite：单张 RTX 4090 达 96 FPS</text>
  <text class="v" x="826" y="202">或同卡 3 路并发推流</text>
  <text class="v" x="826" y="224">Pro：双 RTX 5090 实时</text>
  <text class="kg" x="826" y="252">核心方法</text>
  <text class="v" x="826" y="276">· Oracle 引导的双向蒸馏</text>
  <text class="s" x="842" y="296">用大模型的注意力分布指导学生模型</text>
  <text class="v" x="826" y="320">· 时序音频上下文缓存</text>
  <text class="s" x="842" y="340">小模型也能维持长视频的身份稳定</text>
  <text class="v" x="826" y="364">· VividHead 数据集</text>
  <text class="s" x="842" y="384">33 万片段 / 782 小时 / 15 种语言</text>
  <text class="kg" x="826" y="412">适用场景</text>
  <text class="v" x="826" y="436">高并发直播、游戏 NPC、批量短视频</text>
  <rect class="tag" x="826" y="440" width="150" height="30" rx="9" />
  <text class="tagT" x="901" y="459">单卡高吞吐</text>
  <rect class="tag" x="986" y="440" width="158" height="30" rx="9" />
  <text class="tagT" x="1065" y="459">游戏 / 电商 NPC</text>

  <text class="note" x="30" y="530">三者的差别不在「谁更强」，而在把预算花在哪：FlashTalk 花钱买质量，LiveAct 花钱买时长，FlashHead 花钱买并发。</text>
  <text class="note" x="30" y="556">注：以上数字来自各项目公开的技术报告与评测集，不同测试集与硬件配置之间不可直接横向比较。</text>
</svg>
